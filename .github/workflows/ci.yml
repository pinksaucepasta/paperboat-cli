name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast repository quality contract
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install repository check dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Fetch pinned Codex protocol source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/openai-codex"
          git init "$source_root"
          git -C "$source_root" remote add origin https://github.com/openai/codex.git
          git -C "$source_root" fetch --depth=1 origin refs/tags/rust-v0.149.1:refs/tags/rust-v0.149.1
          test "$(git -C "$source_root" rev-parse 'rust-v0.149.1^{}')" = ff29a44391deccde0aba0f8390337d7f3c319ea4
          git -C "$source_root" checkout --detach ff29a44391deccde0aba0f8390337d7f3c319ea4
          echo "CODEX_SOURCE=$source_root" >> "$GITHUB_ENV"
      - name: Run non-duplicated quality checks
        run: >-
          make verify-toolchain contracts dependencies source-policy metrics-check
          hosted-image-check fmt-check generate-check codex-manifest-check tidy-check vet build

  race:
    name: Linux race detector
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make race

  supply-chain:
    name: Vulnerability and license checks
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run independent supply-chain gates in parallel
        shell: bash
        run: |
          set -euo pipefail
          make vulnerability-check & vulnerability_pid=$!
          make license-check & license_pid=$!
          status=0
          wait "$vulnerability_pid" || status=1
          wait "$license_pid" || status=1
          exit "$status"
