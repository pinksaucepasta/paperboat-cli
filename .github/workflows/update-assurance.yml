name: Update assurance

on:
  pull_request:
    paths:
      - "internal/hostruntime/**"
      - "internal/updater/**"
      - "deploy/hosted/**"
      - "tools/verify-hosted-image.sh"
      - "tools/verify-container-compose.sh"
      - ".github/workflows/update-assurance.yml"
  push:
    branches: [main]
    paths:
      - "internal/hostruntime/**"
      - "internal/updater/**"
      - "deploy/hosted/**"
      - "tools/verify-hosted-image.sh"
      - "tools/verify-container-compose.sh"
      - ".github/workflows/update-assurance.yml"

permissions:
  contents: read

concurrency:
  group: update-assurance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native update tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Stable hostd, worker, session, and updater tests
        run: >-
          go test -count=1
          ./internal/hostruntime/hostd
          ./internal/hostruntime/hostdproto
          ./internal/hostruntime/session
          ./internal/hostruntime/updated
          ./internal/hostruntime/updateflow
          ./internal/hostruntime/workerupdate

  container:
    name: Container deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Static image and POSIX shell checks
        run: ./tools/verify-hosted-image.sh
      - name: Compose syntax and interpolation
        run: ./tools/verify-container-compose.sh

  continuity:
    name: Update continuity, rollback, race, and fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: One hundred worker update soak
        run: >-
          go test -count=1 -run '^TestOneHundredWorkerUpdatesKeepOneHostdAndBoundedRetention$'
          ./internal/hostruntime/workerupdate
      - name: Cutover, rollback, tamper, and journal-fault tests
        run: >-
          go test -count=1 -run '^(TestWorkerUpdate(CutsOverWithoutRestartingHostd|RollsBackWithoutRestartingHostd|LeavesUncertainCutoverForRecovery|RejectsTamperedArtifactBeforeCandidateStart|RejectsNativeSignatureBeforeCandidateStart|RejectsUnsignedCompatibilityRange)|TestJournal)' 
          ./internal/hostruntime/workerupdate ./internal/hostruntime/updateflow
      - name: Race test stable ownership and input recovery
        run: >-
          go test -race -count=1
          ./internal/hostruntime/hostd
          ./internal/hostruntime/hostdproto
          ./internal/hostruntime/session
          ./internal/hostruntime/workerupdate
      - name: Fuzz terminal decoding
        run: >-
          go test -run '^$' -fuzz '^FuzzDecodeTerminalOutput$' -fuzztime=5s
          ./internal/hostruntime/protocol
