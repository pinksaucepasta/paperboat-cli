name: Platform qualification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native platform qualification target
        required: false
        type: choice
        default: all
        options:
          - all
          - windows
          - windows-arm64
          - macos-arm64
  workflow_call:
    inputs:
      target:
        description: Native platform qualification target
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: platform-qualification-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  platform-contract:
    name: Platform ${{ matrix.os }} ${{ matrix.architecture }} contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.target == 'windows' &&
            '[{"os":"windows","architecture":"amd64","runner":"blacksmith-2vcpu-windows-2025"},{"os":"windows","architecture":"arm64","runner":"windows-11-arm"}]' ||
            inputs.target == 'windows-arm64' &&
            '[{"os":"windows","architecture":"arm64","runner":"windows-11-arm"}]' ||
            inputs.target == 'macos-arm64' &&
            '[{"os":"macos","architecture":"arm64","runner":"blacksmith-6vcpu-macos-latest"}]' ||
            '[{"os":"linux","architecture":"amd64","runner":"blacksmith-2vcpu-ubuntu-2404"},{"os":"linux","architecture":"arm64","runner":"blacksmith-2vcpu-ubuntu-2404-arm"},{"os":"macos","architecture":"arm64","runner":"blacksmith-6vcpu-macos-latest"},{"os":"windows","architecture":"amd64","runner":"blacksmith-2vcpu-windows-2025"},{"os":"windows","architecture":"arm64","runner":"windows-11-arm"}]'
          ) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate native runner
        shell: bash
        run: |
          set -euo pipefail
          actual="$(go env GOOS)/$(go env GOARCH)"
          expected_os="${{ matrix.os }}"
          [[ "$expected_os" == macos ]] && expected_os=darwin
          expected="$expected_os/${{ matrix.architecture }}"
          test "$actual" = "$expected" || {
            echo "Runner architecture mismatch: got $actual, expected $expected" >&2
            exit 1
          }
      - name: Provision pinned OpenSSH client for native contract tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageId = 'Microsoft.OpenSSH.Preview'
          $version = '10.0.0.0'
          $sshCandidates = @(
            'C:\Windows\System32\OpenSSH',
            'C:\Program Files\OpenSSH',
            'C:\Program Files\OpenSSH-Win64'
          )
          $ssh = $sshCandidates | ForEach-Object { Join-Path $_ 'ssh.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($ssh)) {
            & winget install --exact --id $packageId --version $version --source winget --scope machine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "Pinned OpenSSH installation failed with exit code $LASTEXITCODE." }
            $ssh = $sshCandidates | ForEach-Object { Join-Path $_ 'ssh.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($ssh)) { throw 'Pinned OpenSSH client was not found after installation.' }
          $ssh = [System.IO.Path]::GetFullPath($ssh)
          if (-not (Test-Path -LiteralPath $ssh -PathType Leaf)) { throw "Pinned OpenSSH client path is not a file: $ssh" }
          $versionOutput = (& $ssh -V 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($versionOutput)) { throw "Pinned OpenSSH client failed version check: $ssh" }
          "PAPERBOAT_OPENSSH_PATH=$ssh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OpenSSH client: $ssh ($versionOutput)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Run native Go tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout 12m ./...
      - name: Run native static checks
        if: matrix.os == 'linux' && matrix.architecture == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          ./packaging/windows/scripts/validate.sh
          ./packaging/windows/scripts/validate-release-pipeline.sh
          go test -count=1 ./packaging/windows/...
      - name: Verify Windows shell and packaging contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/windows/scripts/validate.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging contract failed.' }
          & go test -count=1 ./packaging/windows/...
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging tests failed.' }
          & powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 is unavailable.' }
          & pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 is unavailable.' }
          & cmd.exe /d /c ver
          if ($LASTEXITCODE -ne 0) { throw 'cmd.exe is unavailable.' }
