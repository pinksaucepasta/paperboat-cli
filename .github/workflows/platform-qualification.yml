name: Platform qualification

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9].*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-qualification-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  native-contract:
    name: Native ${{ matrix.os }} ${{ matrix.architecture }} contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            architecture: amd64
            runner: ubuntu-24.04
          - os: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            architecture: arm64
            runner: macos-14
          - os: windows
            architecture: amd64
            runner: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate native runner
        shell: bash
        run: |
          set -euo pipefail
          actual="$(go env GOOS)/$(go env GOARCH)"
          expected_os="${{ matrix.os }}"
          [[ "$expected_os" == macos ]] && expected_os=darwin
          expected="$expected_os/${{ matrix.architecture }}"
          test "$actual" = "$expected" || {
            echo "Runner architecture mismatch: got $actual, expected $expected" >&2
            exit 1
          }
      - name: Provision pinned OpenSSH client for native contract tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageId = 'Microsoft.OpenSSH.Preview'
          $version = '10.0.0.0'
          $sshCandidates = @(
            'C:\Windows\System32\OpenSSH',
            'C:\Program Files\OpenSSH',
            'C:\Program Files\OpenSSH-Win64'
          )
          $ssh = $sshCandidates | ForEach-Object { Join-Path $_ 'ssh.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($ssh)) {
            & winget install --exact --id $packageId --version $version --source winget --scope machine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "Pinned OpenSSH installation failed with exit code $LASTEXITCODE." }
            $ssh = $sshCandidates | ForEach-Object { Join-Path $_ 'ssh.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($ssh)) { throw 'Pinned OpenSSH client was not found after installation.' }
          Split-Path -Parent $ssh | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OpenSSH client: $ssh" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Run native Go tests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if go test -count=1 -timeout 12m ./...; then
              exit 0
            fi
            if [[ "$attempt" == 1 ]]; then
              echo 'Native contract suite failed once; retrying once for transient local service lifecycle failures.' >&2
              sleep 5
            fi
          done
          exit 1
      - name: Run native static checks
        if: matrix.os == 'linux' && matrix.architecture == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          ./packaging/windows/scripts/validate.sh
          ./packaging/windows/scripts/validate-release-pipeline.sh
          go test -count=1 ./packaging/windows/...
      - name: Verify Windows shell and packaging contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/windows/scripts/validate.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging contract failed.' }
          & go test -count=1 ./packaging/windows/...
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging tests failed.' }
          & powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 is unavailable.' }
          & pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 is unavailable.' }
          & cmd.exe /d /c ver
          if ($LASTEXITCODE -ne 0) { throw 'cmd.exe is unavailable.' }

  windows-arm64-cross:
    name: Windows arm64 beta independent cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile every Windows arm64 package and test package
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath ./...
          while IFS= read -r package; do
            name="$(printf '%s' "$package" | sha256sum | cut -d' ' -f1)"
            CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go test -c -vet=off -trimpath -o "$output_dir/$name.test.exe" "$package"
          done < <(CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go list -e -f '{{if or .GoFiles .CgoFiles}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o "$output_dir/pb.exe" ./cmd/pb
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o "$output_dir/pb-launcher.exe" ./cmd/pb-launcher
          python3 - "$output_dir" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for path in root.glob('*.exe'):
              data = path.read_bytes()
              if len(data) < 0x40 or data[:2] != b'MZ': raise SystemExit(f'{path}: invalid PE')
              offset = int.from_bytes(data[0x3c:0x40], 'little')
              if data[offset:offset+4] != b'PE\0\0': raise SystemExit(f'{path}: invalid signature')
              if int.from_bytes(data[offset+4:offset+6], 'little') != 0xaa64: raise SystemExit(f'{path}: not ARM64')
          print('Windows arm64 cross-build and PE validation passed; native evidence remains beta-gated.')
          PY
      - name: Record explicit ARM64 beta status
        shell: bash
        run: |
          printf 'windows_arm64_stability: beta\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'native_windows_arm64_e2e: blocked_no_hardware\n' >> "$GITHUB_STEP_SUMMARY"

  update-native:
    name: Native update tests (${{ matrix.os }})
    if: github.event_name != 'push' || github.ref_type == 'branch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Stable hostd, worker, session, and updater tests
        run: >-
          go test -count=1
          ./internal/hostruntime/hostd ./internal/hostruntime/hostdproto
          ./internal/hostruntime/session ./internal/hostruntime/updated
          ./internal/hostruntime/updateflow ./internal/hostruntime/workerupdate

  update-container:
    name: Container deployment checks
    if: github.event_name != 'push' || github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./tools/verify-hosted-image.sh
      - run: ./tools/verify-container-compose.sh

  update-continuity:
    name: Update continuity and rollback checks
    if: github.event_name != 'push' || github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Update continuity and race tests
        run: >-
          go test -count=1
          ./internal/hostruntime/workerupdate ./internal/hostruntime/updateflow
          ./internal/hostruntime/hostd ./internal/hostruntime/hostdproto
          ./internal/hostruntime/session
