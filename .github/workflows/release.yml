name: Release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install release prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate release version
        run: ./tools/release-version.sh validate "${GITHUB_REF_NAME}"
      - name: Test
        run: make check
      - name: Required Windows cross-build gate
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -o "$check_dir/pb-$arch.exe" ./cmd/pb
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -o "$check_dir/pb-launcher-$arch.exe" ./cmd/pb-launcher
            test -s "$check_dir/pb-$arch.exe"
            test -s "$check_dir/pb-launcher-$arch.exe"
          done
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
          DEFAULT_SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
          DEFAULT_RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DEFAULT_SERVER_URL}" || { echo "PAPERBOAT_DEFAULT_SERVER_URL repository variable is required" >&2; exit 1; }
          test -n "${DEFAULT_RELEASE_URL}" || { echo "PAPERBOAT_DEFAULT_RELEASE_URL repository variable is required" >&2; exit 1; }
          case "${DEFAULT_SERVER_URL}" in https://*) ;; *) echo "PAPERBOAT_DEFAULT_SERVER_URL must use https" >&2; exit 1 ;; esac
          mkdir -p dist stage
          version="${VERSION}"
          commit="${GITHUB_SHA}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            format="elf"
            test "$os" != darwin || format="macho"
            test "$os" != windows || format="pe"
            suffix=""
            test "$os" != windows || suffix=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$version -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$commit -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=${DEFAULT_SERVER_URL} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=${DEFAULT_RELEASE_URL}" \
              -o "stage/pb${suffix}" ./cmd/pb
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$version -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$commit -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=${DEFAULT_SERVER_URL} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=${DEFAULT_RELEASE_URL}" \
              -o "stage/pb-launcher${suffix}" ./cmd/pb-launcher
            cp "stage/pb${suffix}" "dist/pb_${VERSION}_${os}_${arch}${suffix}"
            cp "stage/pb${suffix}" "dist/pb-${os}-${arch}"
            for component in cli runtime hostd updater; do
              cp "stage/pb${suffix}" "dist/${component}-${os}-${arch}"
            done
            cp "stage/pb-launcher${suffix}" "dist/launcher-${os}-${arch}"
            if test "$os" = windows; then
              (cd stage && zip -q "../dist/paperboat_${VERSION}_${os}_${arch}.zip" "pb${suffix}" "pb-launcher${suffix}")
            else
              tar -C stage -czf "dist/paperboat_${VERSION}_${os}_${arch}.tar.gz" pb pb-launcher
            fi
            rm "stage/pb${suffix}" "stage/pb-launcher${suffix}"
          done
          bash tools/package-manifests.sh dist "${GITHUB_REPOSITORY}" "$VERSION"
          cp tools/install.sh dist/install.sh
          (cd dist && sha256sum paperboat_* > SHA256SUMS)
          (cd dist && sha256sum pb-* pb_* cli-* runtime-* hostd-* updater-* launcher-* >> SHA256SUMS)
          (cd dist && sha256sum install.sh >> SHA256SUMS)
      - name: Record native signing prerequisite
        run: |
          {
            echo '## Native signing boundary'
            echo 'This workflow builds and attests artifacts. It does not authorize macOS or Windows artifacts for the signed TUF repository.'
            echo 'The release authority must Developer-ID sign, notarize and staple each macOS component, and Authenticode-sign each Windows component before TUF publication.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/paperboat.spdx.json
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/pb-*
            dist/pb_*
            dist/cli-*
            dist/runtime-*
            dist/hostd-*
            dist/updater-*
            dist/launcher-*
            dist/install.sh
            dist/SHA256SUMS
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish hosted image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/hosted/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PAPERBOAT_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/pinksaucepasta/paperboat-hosted:${{ github.ref_name }}
            ghcr.io/pinksaucepasta/paperboat-hosted:latest
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
