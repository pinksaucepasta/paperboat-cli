name: Release candidate

on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9].*'
  workflow_dispatch:
    inputs:
      version:
        description: Immutable candidate version (YYYY.MM.DD.N)
        required: true
        type: string

concurrency:
  group: release-candidate-${{ github.repository }}-${{ github.sha }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  packages: write
  checks: read
  id-token: write
  attestations: write

env:
  # Tag pushes are the normal release entry point. Keep workflow_dispatch for
  # explicit reruns and derive the same immutable version in both cases.
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release-authority:
    name: Validate protected release authority
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    environment: paperboat-tuf-published
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release version
        shell: bash
        run: ./tools/release-version.sh validate "${RELEASE_VERSION}"
      - name: Fetch public current root chain
        env:
          RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_URL" || { echo 'PAPERBOAT_DEFAULT_RELEASE_URL is required' >&2; exit 1; }
          case "$RELEASE_URL" in https://*) ;; *) echo 'PAPERBOAT_DEFAULT_RELEASE_URL must use https' >&2; exit 1 ;; esac
          repository="$RUNNER_TEMP/tuf-authority"
          metadata="$repository/metadata"
          mkdir -p "$metadata"
          base="${RELEASE_URL%/}/metadata"
          curl_root() {
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 5 --max-time 15 --max-filesize 1048576 --retry 2 --retry-all-errors \
              --output "$2" "$base/$1"
          }
          curl_root root.json "$metadata/root.json"
          root_version=$(python3 - "$metadata/root.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8')).get('signed', {}).get('version')
          if not isinstance(value, int) or isinstance(value, bool) or not 1 <= value <= 64:
              raise SystemExit('served TUF root version must be an integer from 1 through 64')
          print(value)
          PY
          )
          for version in $(seq 1 "$root_version"); do
            curl_root "$version.root.json" "$metadata/$version.root.json"
          done
          install -m 0600 tools/tuf-repository/active-signing-state.json "$repository/.signing-state.json"
          echo "PAPERBOAT_TUF_AUTHORITY_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate online signer authorization
        env:
          PAPERBOAT_TUF_CI: "1"
          PAPERBOAT_TUF_KEY_TARGETS_1: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_1 }}
          PAPERBOAT_TUF_KEY_TARGETS_2: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_2 }}
          PAPERBOAT_TUF_KEY_SNAPSHOT_1: ${{ secrets.PAPERBOAT_TUF_KEY_SNAPSHOT_1 }}
          PAPERBOAT_TUF_KEY_TIMESTAMP_2: ${{ secrets.PAPERBOAT_TUF_KEY_TIMESTAMP_2 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PAPERBOAT_TUF_KEY_TARGETS_1 PAPERBOAT_TUF_KEY_TARGETS_2 PAPERBOAT_TUF_KEY_SNAPSHOT_1 PAPERBOAT_TUF_KEY_TIMESTAMP_2; do
            test -n "${!name}" || { echo "$name is required" >&2; exit 1; }
          done
          go run ./tools/tuf-repository validate-signers \
            -repository "$PAPERBOAT_TUF_AUTHORITY_REPOSITORY" \
            -trusted-root "$GITHUB_WORKSPACE/internal/hostruntime/bootstrap/trusted-root.json"

  platform-qualification:
    name: Native platform qualification
    needs: release-authority
    uses: ./.github/workflows/platform-qualification.yml

  release-linux:
    name: Build Linux ${{ matrix.architecture }} release assets
    needs: release-authority
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
          - architecture: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Candidate builds reuse the module/build cache; qualification still
          # consumes the exact uploaded artifacts rather than rebuilding them.
          cache: true
      - name: Validate release version
        run: ./tools/release-version.sh validate "${RELEASE_VERSION}"
      - name: Build Unix archives only
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          DEFAULT_SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
          DEFAULT_RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEFAULT_SERVER_URL}" || { echo "PAPERBOAT_DEFAULT_SERVER_URL repository variable is required" >&2; exit 1; }
          test -n "${DEFAULT_RELEASE_URL}" || { echo "PAPERBOAT_DEFAULT_RELEASE_URL repository variable is required" >&2; exit 1; }
          case "${DEFAULT_SERVER_URL}" in https://*) ;; *) echo "PAPERBOAT_DEFAULT_SERVER_URL must use https" >&2; exit 1 ;; esac
          mkdir -p dist stage
          os=linux
          arch="${{ matrix.architecture }}"
          suffix=""
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=${VERSION} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=${DEFAULT_SERVER_URL} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=${DEFAULT_RELEASE_URL}" \
              -o "stage/pb${suffix}" ./cmd/pb
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=${VERSION} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=${DEFAULT_SERVER_URL} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=${DEFAULT_RELEASE_URL}" \
              -o "stage/pb-launcher${suffix}" ./cmd/pb-launcher
            cp "stage/pb${suffix}" "dist/pb_${VERSION}_${os}_${arch}"
            cp "stage/pb${suffix}" "dist/pb-${os}-${arch}"
            cp "stage/pb${suffix}" "dist/cli-${os}-${arch}"
            cp "stage/pb${suffix}" "dist/runtime-${os}-${arch}"
            cp "stage/pb${suffix}" "dist/hostd-${os}-${arch}"
            cp "stage/pb${suffix}" "dist/updater-${os}-${arch}"
            cp "stage/pb-launcher${suffix}" "dist/launcher-${os}-${arch}"
            tar -C stage -czf "dist/paperboat_${VERSION}_${os}_${arch}.tar.gz" pb pb-launcher
            rm "stage/pb${suffix}" "stage/pb-launcher${suffix}"
          cp tools/install.sh dist/install.sh
      - name: Upload Unix release handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.architecture }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  release-macos:
    name: Build macOS release assets
    needs: release-authority
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-6vcpu-macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build macOS arm64 archive
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          DEFAULT_SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
          DEFAULT_RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          for tool in pb pb-launcher; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=${VERSION} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=${DEFAULT_SERVER_URL} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=${DEFAULT_RELEASE_URL}" \
              -o "stage/${tool}" "./cmd/${tool}"
          done
          cp stage/pb "dist/pb_${VERSION}_darwin_arm64"
          cp stage/pb "dist/cli-darwin-arm64"
          cp stage/pb "dist/runtime-darwin-arm64"
          cp stage/pb "dist/hostd-darwin-arm64"
          cp stage/pb "dist/updater-darwin-arm64"
          cp stage/pb-launcher "dist/launcher-darwin-arm64"
          tar -C stage -czf "dist/paperboat_${VERSION}_darwin_arm64.tar.gz" pb pb-launcher
          cp tools/install.sh dist/install.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist
          if-no-files-found: error
          retention-days: 14

  release-windows:
    name: Windows ${{ matrix.architecture }} (${{ matrix.channel }}) package
    needs: release-authority
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            channel: stable
            runner: blacksmith-2vcpu-windows-2025
          - architecture: arm64
            channel: stable
            runner: windows-11-arm
    env:
      PAPERBOAT_ARCH: ${{ matrix.architecture }}
      PAPERBOAT_CHANNEL: ${{ matrix.channel }}
      PAPERBOAT_DEFAULT_SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
      PAPERBOAT_DEFAULT_RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned WiX toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.nuget\packages
            ~\.dotnet\tools
            ~\.store
          key: wix-5.0.2-${{ runner.os }}-${{ runner.arch }}
      - name: Add native Windows tool paths
        shell: powershell
        run: |
          'C:\Program Files\PowerShell\7' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\Python313' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate Windows release pipeline contract
        shell: cmd
        run: '"C:\\Program Files\\Git\\bin\\bash.exe" --noprofile --norc -e -o pipefail -c "./packaging/windows/scripts/validate-release-pipeline.sh"'
      - name: Validate first-party Windows packaging contract
        shell: powershell
        run: |
          & go run ./packaging/windows/cmd/validate --root packaging/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging contract validation failed.' }
          & go test -count=1 ./packaging/windows/cmd/... ./packaging/windows/manifest/...
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging tests failed.' }
      - name: Install pinned WiX Toolset
        shell: powershell
        run: |
          $toolDirectory = Join-Path $env:USERPROFILE '.dotnet\tools'
          $cachedWix = Join-Path $toolDirectory 'wix.exe'
          if (-not (Test-Path -LiteralPath $cachedWix -PathType Leaf)) {
            dotnet tool install --global wix --version 5.0.2
            if ($LASTEXITCODE -ne 0) { throw 'Pinned WiX 5.0.2 installation failed.' }
          }
          $env:PATH = "$toolDirectory;$env:PATH"
          $wix = (Get-Command wix.exe -ErrorAction Stop).Path
          $wixVersion = (& $wix --version | Out-String).Trim()
          if ($wixVersion -notmatch '(^|[^0-9])5\.0\.2([^0-9]|$)') {
            throw "Expected WiX 5.0.2, got $wixVersion."
          }
          "PAPERBOAT_WIX_PATH=$wix" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
          "PAPERBOAT_WIX_VERSION=5.0.2" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Build native Windows PE inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage\windows-$env:PAPERBOAT_ARCH"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $stage, $dist | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:PAPERBOAT_DEFAULT_SERVER_URL) -or [string]::IsNullOrWhiteSpace($env:PAPERBOAT_DEFAULT_RELEASE_URL)) {
            throw 'PAPERBOAT_DEFAULT_SERVER_URL and PAPERBOAT_DEFAULT_RELEASE_URL repository variables are required.'
          }
          if ($env:PAPERBOAT_DEFAULT_SERVER_URL -notmatch '^https://') {
            throw 'PAPERBOAT_DEFAULT_SERVER_URL must use https.'
          }
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = $env:PAPERBOAT_ARCH
          $ldflags = "-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$version -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=$env:PAPERBOAT_DEFAULT_SERVER_URL -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=$env:PAPERBOAT_DEFAULT_RELEASE_URL"
          & go build -buildvcs=false -trimpath -ldflags $ldflags -o (Join-Path $stage 'pb.exe') ./cmd/pb
          if ($LASTEXITCODE -ne 0) { throw 'Windows amd64/arm64 CLI build failed.' }
          & go build -buildvcs=false -trimpath -ldflags $ldflags -o (Join-Path $stage 'pb-launcher.exe') ./cmd/pb-launcher
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher build failed.' }
          foreach ($role in @('paperboat-runtime.exe', 'paperboat-hostd.exe', 'paperboat-updater.exe')) {
            Copy-Item -LiteralPath (Join-Path $stage 'pb.exe') -Destination (Join-Path $stage $role)
          }
          "PAPERBOAT_WINDOWS_STAGE=$stage" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
          "PAPERBOAT_WINDOWS_DIST=$dist" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Apply optional Authenticode and verify every Windows PE
        shell: powershell
        env:
          PAPERBOAT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_B64 }}
          PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pePaths = @(
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'pb.exe'),
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'pb-launcher.exe'),
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'paperboat-runtime.exe'),
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'paperboat-hostd.exe'),
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'paperboat-updater.exe')
          )
          & ./packaging/windows/scripts/sign-and-verify.ps1 `
            -Path $pePaths `
            -Architecture $env:PAPERBOAT_ARCH
          if (-not $?) { throw 'Windows PE signing or verification failed.' }
      - name: Build MSI with WiX 5.0.2
        shell: powershell
        run: |
          & ./packaging/windows/scripts/build-msi.ps1 `
            -Version $env:RELEASE_VERSION `
            -Architecture $env:PAPERBOAT_ARCH `
            -Channel $env:PAPERBOAT_CHANNEL `
            -StagingDirectory $env:PAPERBOAT_WINDOWS_STAGE `
            -OutputDirectory $env:PAPERBOAT_WINDOWS_DIST `
            -WixCommand $env:PAPERBOAT_WIX_PATH `
            -ExpectedWixVersion $env:PAPERBOAT_WIX_VERSION
          if (-not $?) { throw 'Windows MSI build failed.' }
      - name: Apply optional Authenticode and verify the MSI
        shell: powershell
        env:
          PAPERBOAT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_B64 }}
          PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $msi = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("paperboat_{0}_windows_{1}.msi" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH)
          & ./packaging/windows/scripts/sign-and-verify.ps1 `
            -Path @($msi) `
            -Architecture $env:PAPERBOAT_ARCH
          if (-not $?) { throw 'Windows MSI signing or verification failed.' }
      - name: Package verified Windows ZIP
        shell: powershell
        run: |
          $env:SOURCE_DATE_EPOCH = '0'
          $zip = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("paperboat_{0}_windows_{1}.zip" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH)
          & ./packaging/windows/scripts/package-zip.ps1 `
            --version $env:RELEASE_VERSION `
            --architecture $env:PAPERBOAT_ARCH `
            --channel $env:PAPERBOAT_CHANNEL `
            --staging $env:PAPERBOAT_WINDOWS_STAGE `
            --output $zip
          if (-not $?) { throw 'Windows ZIP packaging failed.' }
      - name: Verify Windows cross-architecture artifacts
        shell: powershell
        run: |
          $msi = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("paperboat_{0}_windows_{1}.msi" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH)
          $zip = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("paperboat_{0}_windows_{1}.zip" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH)
          & ./packaging/windows/scripts/verify-cross-artifacts.ps1 `
            -Architecture $env:PAPERBOAT_ARCH `
            -StagingDirectory $env:PAPERBOAT_WINDOWS_STAGE `
            -MsiPath $msi `
            -ZipPath $zip
          if (-not $?) { throw 'Windows cross-architecture artifact verification failed.' }
      - name: Copy verified PE release assets
        shell: powershell
        run: |
          $files = @{
            'pb.exe' = "paperboat_{0}_windows_{1}_pb.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
            'pb-launcher.exe' = "paperboat_{0}_windows_{1}_pb-launcher.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
            'paperboat-runtime.exe' = "paperboat_{0}_windows_{1}_paperboat-runtime.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
            'paperboat-hostd.exe' = "paperboat_{0}_windows_{1}_paperboat-hostd.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
            'paperboat-updater.exe' = "paperboat_{0}_windows_{1}_paperboat-updater.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
          }
          foreach ($sourceName in $files.Keys) {
            Copy-Item -LiteralPath (Join-Path $env:PAPERBOAT_WINDOWS_STAGE $sourceName) -Destination (Join-Path $env:PAPERBOAT_WINDOWS_DIST $files[$sourceName])
          }
          # The one-shot https://get.pprbt.dev/install bootstrap downloads a
          # stable, architecture-specific name. Keep this as a byte-for-byte
          # copy of the already verified CLI so its TUF digest is authoritative.
          Copy-Item -LiteralPath (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'pb.exe') -Destination (Join-Path $env:PAPERBOAT_WINDOWS_DIST ("pb-windows-{0}.exe" -f $env:PAPERBOAT_ARCH))
          $tufFiles = @{
            'pb.exe' = "cli-windows-$env:PAPERBOAT_ARCH"
            'pb-launcher.exe' = "launcher-windows-$env:PAPERBOAT_ARCH"
            'paperboat-runtime.exe' = "runtime-windows-$env:PAPERBOAT_ARCH"
            'paperboat-hostd.exe' = "hostd-windows-$env:PAPERBOAT_ARCH"
            'paperboat-updater.exe' = "updater-windows-$env:PAPERBOAT_ARCH"
          }
          foreach ($sourceName in $tufFiles.Keys) {
            Copy-Item -LiteralPath (Join-Path $env:PAPERBOAT_WINDOWS_STAGE $sourceName) -Destination (Join-Path $env:PAPERBOAT_WINDOWS_DIST $tufFiles[$sourceName])
          }
      - name: Bind native Windows evidence to final release bytes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $components = @('cli', 'runtime', 'hostd', 'updater', 'launcher')
          $artifacts = foreach ($component in $components) {
            $name = "$component-windows-$env:PAPERBOAT_ARCH"
            $path = Join-Path $env:PAPERBOAT_WINDOWS_DIST $name
            $item = Get-Item -LiteralPath $path -ErrorAction Stop
            @{
              component = $component
              target_path = $name
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              length = $item.Length
              platform = 'windows'
              architecture = $env:PAPERBOAT_ARCH
              status = 'passed'
            }
          }
          $evidence = @{
            schema = 'paperboat.windows-native-qualification/v1'
            release_version = $env:RELEASE_VERSION
            platform = 'windows'
            architecture = $env:PAPERBOAT_ARCH
            status = 'passed'
            native_tested = $true
            windows_build = [Environment]::OSVersion.Version.Build.ToString()
            runner = $env:RUNNER_NAME
            artifacts = @($artifacts)
          } | ConvertTo-Json -Depth 5
          $path = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("windows-{0}-native-qualification.json" -f $env:PAPERBOAT_ARCH)
          [IO.File]::WriteAllText($path, $evidence + "`n", [Text.UTF8Encoding]::new($false))
      - name: Generate signing manifest, checksums, SBOM, and provenance handoff
        shell: powershell
        run: |
          & ./packaging/windows/scripts/generate-signing-handoff.ps1 `
            -Version $env:RELEASE_VERSION `
            -Architecture $env:PAPERBOAT_ARCH `
            -Channel $env:PAPERBOAT_CHANNEL `
            -OutputDirectory $env:PAPERBOAT_WINDOWS_DIST `
            -WixVersion $env:PAPERBOAT_WIX_VERSION
          if (-not $?) { throw 'Windows integrity handoff generation failed.' }
      - name: Scan signed artifacts with Microsoft Defender when available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
          } catch {
            Write-Warning "Microsoft Defender is unavailable on this GitHub-hosted Windows runner; continuing with signed-artifact integrity and provenance checks. Error: $($_.Exception.Message)"
            exit 0
          }
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            Write-Warning 'Microsoft Defender antivirus or real-time protection is unavailable on this GitHub-hosted Windows runner; continuing with signed-artifact integrity and provenance checks.'
            exit 0
          }
          Update-MpSignature -ErrorAction Stop
          $before = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | ForEach-Object ThreatID)
          Start-MpScan -ScanType CustomScan -ScanPath $env:PAPERBOAT_WINDOWS_DIST -ErrorAction Stop
          $after = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.Resources -match [regex]::Escape($env:PAPERBOAT_WINDOWS_DIST) })
          if ($after.Count -ne 0) {
            $after | Format-List | Out-String | Write-Error
            throw 'Microsoft Defender detected a threat in signed Windows release artifacts.'
          }
      - name: Upload signed Windows handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.architecture }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  windows-winget:
    name: Render final-hash WinGet manifests
    needs: release-windows
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && needs.release-windows.result == 'success'
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download final signed MSI handoffs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-amd64
          path: input/amd64
      - name: Download final signed ARM64 MSI handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-arm64
          path: input/arm64
      - name: Render and validate WinGet manifests from final MSI bytes
        shell: powershell
        run: |
          $amd64Msi = Join-Path $env:GITHUB_WORKSPACE ("input\amd64\paperboat_{0}_windows_amd64.msi" -f $env:RELEASE_VERSION)
          $arm64Msi = Join-Path $env:GITHUB_WORKSPACE ("input\arm64\paperboat_{0}_windows_arm64.msi" -f $env:RELEASE_VERSION)
          & ./packaging/windows/scripts/render-winget.ps1 `
            -Version $env:RELEASE_VERSION `
            -Repository $env:GITHUB_REPOSITORY `
            -Amd64Msi $amd64Msi `
            -Arm64Msi $arm64Msi `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist')
          if (-not $?) { throw 'Final-hash WinGet manifest rendering failed.' }
      - name: Validate rendered WinGet manifest contract
        shell: pwsh
        run: |
          $amd64Msi = Join-Path $env:GITHUB_WORKSPACE ("input\amd64\paperboat_{0}_windows_amd64.msi" -f $env:RELEASE_VERSION)
          $arm64Msi = Join-Path $env:GITHUB_WORKSPACE ("input\arm64\paperboat_{0}_windows_arm64.msi" -f $env:RELEASE_VERSION)
          go run ./packaging/windows/cmd/validate-winget `
            --manifest-directory dist/stable `
            --repository $env:GITHUB_REPOSITORY `
            --version $env:RELEASE_VERSION `
            --amd64-msi $amd64Msi `
            --arm64-msi $arm64Msi
      - name: Upload final WinGet manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-winget
          path: dist
          if-no-files-found: error
          retention-days: 14

  candidate-assembly:
    name: Assemble immutable qualified candidate
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
      needs.release-authority.result == 'success' &&
      needs.platform-qualification.result == 'success' &&
      needs.release-linux.result == 'success' &&
      needs.release-macos.result == 'success' &&
      needs.release-windows.result == 'success' &&
      needs.windows-winget.result == 'success'
    needs: [release-authority, platform-qualification, release-linux, release-macos, release-windows, windows-winget]
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download Linux release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-amd64
          path: dist
      - name: Download Linux ARM64 release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-arm64
          path: dist
      - name: Download macOS release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos
          path: dist
      - name: Download Windows amd64 handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-amd64
          path: dist
      - name: Download Windows arm64 handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-arm64
          path: dist
      - name: Download rendered WinGet manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-winget
          path: dist/winget
      - name: Generate Homebrew manifest from complete Unix release set
        shell: bash
        run: |
          set -euo pipefail
          bash tools/package-manifests.sh dist "${GITHUB_REPOSITORY}" "${RELEASE_VERSION}"
      - name: Verify and merge Windows release handoffs
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/windows/scripts/merge-signing-manifests.py \
            --dist dist \
            --release "${RELEASE_VERSION}"
      - name: Add certified OpenSSH compatibility metadata to release
        shell: bash
        run: |
          set -euo pipefail
          cp internal/windowsopenssh/compatibility.json dist/windows-openssh-compatibility.json
      - name: Verify WinGet manifests still match downloaded MSI bytes
        shell: bash
        run: |
          set -euo pipefail
          cp dist/winget/stable/*.yaml dist/
          python3 packaging/windows/scripts/verify-winget-manifests.py --dist dist --release "${RELEASE_VERSION}"
          rm -rf dist/winget
      - name: Generate final release checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done) > dist/SHA256SUMS
      - name: Generate final SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/paperboat.spdx.json
      - name: Refresh checksums after SBOM generation
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done) > dist/SHA256SUMS
      - name: Attest final release assets and preserve provenance handoff
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.exe
            dist/*.sha256
            dist/pb-*
            dist/pb_*
            dist/cli-*
            dist/runtime-*
            dist/hostd-*
            dist/updater-*
            dist/launcher-*
            dist/install.sh
            dist/SHA256SUMS
            dist/*.spdx.json
            dist/windows-signing-manifest*.json
            dist/windows-provenance-*.json
            dist/Pinksaucepasta.Paperboat*.yaml
            dist/windows-openssh-compatibility.json
      - name: Write immutable candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('dist')
          artifacts = []
          for path in sorted(p for p in root.iterdir() if p.is_file()):
              artifacts.append({
                  'name': path.name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'size': path.stat().st_size,
              })
          manifest = {
              'schema': 'paperboat.release-candidate/v1',
              'version': os.environ['RELEASE_VERSION'],
              'commit': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'artifacts': artifacts,
          }
          (root / 'release-candidate.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload immutable qualified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ env.RELEASE_VERSION }}
          path: dist
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release-publication:
    name: Publish qualified release to production
    needs: candidate-assembly
    if: needs.candidate-assembly.result == 'success'
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
      attestations: write
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    environment: paperboat-tuf-published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up release toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ env.RELEASE_VERSION }}
          path: dist
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          run-id: ${{ github.run_id }}
      - name: Verify immutable candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist')
          manifest = json.loads((root / 'release-candidate.json').read_text())
          if manifest.get('schema') != 'paperboat.release-candidate/v1' or manifest.get('version') != os.environ['RELEASE_VERSION'] or manifest.get('commit') != os.environ['GITHUB_SHA'] or manifest.get('repository') != os.environ['GITHUB_REPOSITORY'] or str(manifest.get('run_id')) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit('candidate identity does not match this workflow run')
          expected = {item['name']: item for item in manifest.get('artifacts', [])}
          actual = {path.name for path in root.iterdir() if path.is_file() and path.name != 'release-candidate.json'}
          if set(expected) != actual:
              raise SystemExit('candidate file set does not match its manifest')
          for name, item in expected.items():
              body = (root / name).read_bytes()
              if len(body) != item['size'] or hashlib.sha256(body).hexdigest() != item['sha256']:
                  raise SystemExit(f'candidate artifact mismatch: {name}')
          PY
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" --draft=false --latest=false --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --generate-notes --latest=false
          fi
          while IFS= read -r -d '' file; do gh release upload "$RELEASE_VERSION" "$file" --clobber; done < <(find dist -maxdepth 1 -type f -print0)
      - name: Configure pinned Hetzner publication identity
        env:
          PAPERBOAT_RELEASE_SSH_KEY: ${{ secrets.PAPERBOAT_RELEASE_SSH_KEY }}
          PAPERBOAT_RELEASE_KNOWN_HOSTS: ${{ secrets.PAPERBOAT_RELEASE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAPERBOAT_RELEASE_SSH_KEY" || { echo 'PAPERBOAT_RELEASE_SSH_KEY is required' >&2; exit 1; }
          test -n "$PAPERBOAT_RELEASE_KNOWN_HOSTS" || { echo 'PAPERBOAT_RELEASE_KNOWN_HOSTS is required' >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PAPERBOAT_RELEASE_SSH_KEY" > "$HOME/.ssh/paperboat-release"
          chmod 0600 "$HOME/.ssh/paperboat-release"
          printf '%s\n' "$PAPERBOAT_RELEASE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Fetch current production TUF repository
        env:
          RELEASE_HOST: ${{ vars.PAPERBOAT_RELEASE_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_HOST" || { echo 'PAPERBOAT_RELEASE_HOST is required' >&2; exit 1; }
          repository="$RUNNER_TEMP/tuf-production"
          mkdir -p "$repository"
          ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST" \
            'tar -C /opt/paperboat/releases/current/tuf -cf - metadata targets' | tar -C "$repository" -xf -
          install -m 0600 tools/tuf-repository/active-signing-state.json "$repository/.signing-state.json"
          echo "PAPERBOAT_TUF_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - name: Sign and verify production TUF release
        env:
          PAPERBOAT_TUF_CI: "1"
          PAPERBOAT_TUF_KEY_TARGETS_1: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_1 }}
          PAPERBOAT_TUF_KEY_TARGETS_2: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_2 }}
          PAPERBOAT_TUF_KEY_SNAPSHOT_1: ${{ secrets.PAPERBOAT_TUF_KEY_SNAPSHOT_1 }}
          PAPERBOAT_TUF_KEY_TIMESTAMP_2: ${{ secrets.PAPERBOAT_TUF_KEY_TIMESTAMP_2 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PAPERBOAT_TUF_KEY_TARGETS_1 PAPERBOAT_TUF_KEY_TARGETS_2 PAPERBOAT_TUF_KEY_SNAPSHOT_1 PAPERBOAT_TUF_KEY_TIMESTAMP_2; do
            test -n "${!name}" || { echo "$name is required" >&2; exit 1; }
          done
          signer="$RUNNER_TEMP/paperboat-tuf"
          go build -trimpath -o "$signer" ./tools/tuf-repository
          "$signer" validate-signers \
            -repository "$PAPERBOAT_TUF_REPOSITORY" \
            -trusted-root "$GITHUB_WORKSPACE/internal/hostruntime/bootstrap/trusted-root.json"
          "$signer" publish \
            -repository "$PAPERBOAT_TUF_REPOSITORY" \
            -version "$RELEASE_VERSION" \
            -artifacts "$GITHUB_WORKSPACE/dist" \
            -windows-amd64-native-evidence "$GITHUB_WORKSPACE/dist/windows-amd64-native-qualification.json" \
            -windows-arm64-native-evidence "$GITHUB_WORKSPACE/dist/windows-arm64-native-qualification.json" \
            -rollout-revision "$GITHUB_RUN_ID" \
            -percentage 100 \
            -severity routine
          "$signer" verify-published -repository "$PAPERBOAT_TUF_REPOSITORY"
      - name: Atomically publish TUF and current.json to Hetzner
        env:
          RELEASE_HOST: ${{ vars.PAPERBOAT_RELEASE_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/paperboat-production-release"
          mkdir -p "$publish/tuf"
          cp -R "$PAPERBOAT_TUF_REPOSITORY/metadata" "$PAPERBOAT_TUF_REPOSITORY/targets" "$publish/tuf/"
          install -m 0755 dist/install.sh "$publish/install"
          printf '{"schema":"paperboat.release-current/v1","version":"%s"}\n' "$RELEASE_VERSION" > "$publish/current.json"
          bundle="$RUNNER_TEMP/paperboat-release-$RELEASE_VERSION.tgz"
          tar -C "$publish" -czf "$bundle" current.json install tuf
          digest=$(sha256sum "$bundle" | awk '{print $1}')
          remote_bundle="/opt/paperboat/releases/staging/paperboat-release-$RELEASE_VERSION-$GITHUB_SHA.tgz"
          remote_script="/opt/paperboat/releases/staging/publish-tuf-origin-$GITHUB_RUN_ID.sh"
          scp -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "root@$RELEASE_HOST:$remote_bundle"
          scp -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes tools/publish-tuf-origin.sh "root@$RELEASE_HOST:$remote_script"
          ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST" \
            "chmod 0700 '$remote_script' && '$remote_script' '$remote_bundle' /opt/paperboat/releases '$RELEASE_VERSION' '$digest'"
      - name: Verify public updater and current release
        env:
          PAPERBOAT_TEST_TUF_REPOSITORY_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
          PAPERBOAT_TEST_TUF_VERSION: ${{ env.RELEASE_VERSION }}
          PAPERBOAT_CURRENT_URL: https://api.pprbt.dev/current.json
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/hostruntime/bootstrap -run '^TestProductionTUFRepository$' -count=1
          current=$(curl --fail --silent --show-error "$PAPERBOAT_CURRENT_URL")
          python3 - "$RELEASE_VERSION" "$current" <<'PY'
          import json, sys
          if json.loads(sys.argv[2]) != {"schema": "paperboat.release-current/v1", "version": sys.argv[1]}:
              raise SystemExit('public current.json does not match the release')
          PY
      - name: Mark verified GitHub release latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_VERSION" --draft=false --latest --target "$GITHUB_SHA"
