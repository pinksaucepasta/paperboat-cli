name: Release

on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9].*'
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (YYYY.MM.DD.N)
        required: true
        type: string

concurrency:
  group: paperboat-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release-authority:
    name: Validate release authority
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 8
    environment: paperboat-tuf-published
    permissions:
      contents: read
    outputs:
      server_url: ${{ steps.endpoints.outputs.server_url }}
      release_url: ${{ steps.endpoints.outputs.release_url }}
      release_host: ${{ steps.endpoints.outputs.release_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release version before network work
        shell: bash
        run: ./tools/release-version.sh validate "$RELEASE_VERSION"
      - name: Validate protected release endpoints
        id: endpoints
        env:
          SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
          RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
          INSTALL_URL: ${{ vars.PAPERBOAT_INSTALL_URL }}
          RELEASE_HOST: ${{ vars.PAPERBOAT_RELEASE_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from urllib.parse import urlsplit

          def endpoint(name, value, path=None):
              if not value or value != value.strip() or any(c.isspace() for c in value):
                  raise SystemExit(f'{name} is required and must not contain whitespace')
              parsed = urlsplit(value)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.port not in (None, 443):
                  raise SystemExit(f'{name} must be an HTTPS URL without credentials, query, fragment, or non-default port')
              if path is not None and parsed.path != path:
                  raise SystemExit(f'{name} must use the exact {path} path')
              if path is None and parsed.path not in ('', '/'):
                  raise SystemExit(f'{name} must be an HTTPS origin without a path')
              return f'https://{parsed.hostname.lower()}{path or ""}'

          server = endpoint('PAPERBOAT_DEFAULT_SERVER_URL', os.environ.get('SERVER_URL', ''))
          release = endpoint('PAPERBOAT_DEFAULT_RELEASE_URL', os.environ.get('RELEASE_URL', ''), '/tuf')
          install = endpoint('PAPERBOAT_INSTALL_URL', os.environ.get('INSTALL_URL', ''), '/install')
          if urlsplit(release).hostname != urlsplit(install).hostname:
              raise SystemExit('PAPERBOAT_DEFAULT_RELEASE_URL and PAPERBOAT_INSTALL_URL must share one public origin')
          host = os.environ.get('RELEASE_HOST', '')
          if not host or host != host.strip() or any(c.isspace() for c in host) or '/' in host or ':' in host:
              raise SystemExit('PAPERBOAT_RELEASE_HOST must be a canonical SSH host name or IPv4 address')
          print(f'server_url={server}')
          print(f'release_url={release}')
          print(f'release_host={host}')
          PY
      - name: Configure protected release origin identity
        env:
          PAPERBOAT_RELEASE_SSH_KEY: ${{ secrets.PAPERBOAT_RELEASE_SSH_KEY }}
          PAPERBOAT_RELEASE_KNOWN_HOSTS: ${{ secrets.PAPERBOAT_RELEASE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAPERBOAT_RELEASE_SSH_KEY" || { echo 'PAPERBOAT_RELEASE_SSH_KEY is required' >&2; exit 1; }
          test -n "$PAPERBOAT_RELEASE_KNOWN_HOSTS" || { echo 'PAPERBOAT_RELEASE_KNOWN_HOSTS is required' >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PAPERBOAT_RELEASE_SSH_KEY" > "$HOME/.ssh/paperboat-release"
          printf '%s\n' "$PAPERBOAT_RELEASE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/paperboat-release" "$HOME/.ssh/known_hosts"
      - name: Verify publication origin readiness
        env:
          RELEASE_HOST: ${{ steps.endpoints.outputs.release_host }}
          RELEASE_URL: ${{ steps.endpoints.outputs.release_url }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/opt/paperboat/releases
          test -d "$root" && test ! -L "$root"
          test -d "$root/current" && test ! -L "$root/current"
          test -d "$root/staging" && test ! -L "$root/staging"
          test -d "$root/current/tuf/metadata" && test ! -L "$root/current/tuf/metadata"
          test -d "$root/current/tuf/targets" && test ! -L "$root/current/tuf/targets"
          REMOTE
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 5 --max-time 15 --max-filesize 1048576 \
            "$RELEASE_URL/metadata/root.json" -o "$RUNNER_TEMP/paperboat-root.json"

  release-contract:
    name: Validate release contract
    needs: release-authority
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate five-asset release workflow
        shell: bash
        run: ./packaging/windows/scripts/validate-release-pipeline.sh
      - name: Run focused release safety tests
        shell: bash
        run: go test -count=1 ./cmd/pb ./internal/hostruntime/bootstrap ./internal/hostruntime/service

  release-linux:
    name: Build Linux ${{ matrix.architecture }} asset
    needs: [release-authority, release-contract]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
          - architecture: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
    env:
      DEFAULT_SERVER_URL: ${{ needs.release-authority.outputs.server_url }}
      DEFAULT_RELEASE_URL: ${{ needs.release-authority.outputs.release_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Blacksmith transparently serves setup-go's native module/build cache.
          cache: true
      - name: Build one unified Linux executable
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-release-asset.sh \
            --platform linux \
            --architecture '${{ matrix.architecture }}' \
            --output "dist/pb-linux-${{ matrix.architecture }}" \
            --version "$RELEASE_VERSION" \
            --server-url "$DEFAULT_SERVER_URL" \
            --release-url "$DEFAULT_RELEASE_URL"
      - name: Smoke test Linux asset
        shell: bash
        run: |
          set -euo pipefail
          file "dist/pb-linux-${{ matrix.architecture }}" | grep -E 'ELF|executable'
          "dist/pb-linux-${{ matrix.architecture }}" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.architecture }}
          path: dist/pb-linux-${{ matrix.architecture }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-windows:
    name: Build Windows ${{ matrix.architecture }} asset
    needs: [release-authority, release-contract]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: blacksmith-2vcpu-windows-2025
          - architecture: arm64
            runner: windows-11-arm
    env:
      DEFAULT_SERVER_URL: ${{ needs.release-authority.outputs.server_url }}
      DEFAULT_RELEASE_URL: ${{ needs.release-authority.outputs.release_url }}
      PAPERBOAT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_B64 }}
      PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD }}
      PAPERBOAT_WINDOWS_PUBLISHER_SUBJECT: ${{ vars.PAPERBOAT_WINDOWS_PUBLISHER_SUBJECT }}
      PAPERBOAT_WINDOWS_TIMESTAMP_URL: ${{ vars.PAPERBOAT_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build one unified Windows executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist\pb-windows-${{ matrix.architecture }}.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = '${{ matrix.architecture }}'
          $ldflags = "-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$env:RELEASE_VERSION -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=$env:DEFAULT_SERVER_URL -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=$env:DEFAULT_RELEASE_URL"
          & go build -buildvcs=false -trimpath -ldflags $ldflags -o $output ./cmd/pb
          if ($LASTEXITCODE -ne 0) { throw 'Unified Windows executable build failed.' }
      - name: Authenticode sign when release certificate is configured
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/windows/scripts/sign-and-verify.ps1 `
            -Path (Join-Path $env:GITHUB_WORKSPACE 'dist\pb-windows-${{ matrix.architecture }}.exe') `
            -Architecture '${{ matrix.architecture }}' `
            -Description 'Paperboat unified executable'
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable signing failed.' }
      - name: Smoke test Windows asset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist\pb-windows-${{ matrix.architecture }}.exe'
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Windows release asset is missing.' }
          & $output --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows release asset failed its version smoke test.' }
      - name: Record native Windows qualification handoff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $qualification = [ordered]@{
            schema = 'paperboat.windows-native-qualification/v1'
            release_version = $env:RELEASE_VERSION
            platform = 'windows'
            architecture = '${{ matrix.architecture }}'
            status = 'passed'
            native_tested = $true
            windows_build = [Environment]::OSVersion.Version.Build.ToString()
            runner = if ($env:RUNNER_NAME) { $env:RUNNER_NAME } else { '${{ matrix.runner }}' }
          }
          $qualificationPath = Join-Path $env:RUNNER_TEMP 'windows-${{ matrix.architecture }}-native-qualification.json'
          $json = $qualification | ConvertTo-Json -Compress
          [IO.File]::WriteAllText($qualificationPath, $json, (New-Object Text.UTF8Encoding($false)))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.architecture }}
          path: dist/pb-windows-${{ matrix.architecture }}.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-windows-${{ matrix.architecture }}
          path: ${{ runner.temp }}/windows-${{ matrix.architecture }}-native-qualification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-macos:
    name: Build macOS arm64 PKG
    needs: [release-authority, release-contract]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEFAULT_SERVER_URL: ${{ needs.release-authority.outputs.server_url }}
      DEFAULT_RELEASE_URL: ${{ needs.release-authority.outputs.release_url }}
      APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Import Developer ID Installer certificate
        if: env.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_INSTALLER_CERTIFICATE_PASSWORD APPLE_INSTALLER_SIGNING_IDENTITY; do
            test -n "${!name}" || { echo "$name is required when an Apple installer certificate is configured" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/paperboat-release.keychain-db"
          password="$(uuidgen)"
          certificate="$RUNNER_TEMP/paperboat-installer.p12"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate" 2>/dev/null || printf '%s' "$APPLE_INSTALLER_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
      - name: Build one macOS PKG
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-release-asset.sh \
            --platform darwin \
            --architecture arm64 \
            --output "$RUNNER_TEMP/pb-darwin-arm64" \
            --version "$RELEASE_VERSION" \
            --server-url "$DEFAULT_SERVER_URL" \
            --release-url "$DEFAULT_RELEASE_URL"
          mkdir -p dist
          if [ -n "$APPLE_INSTALLER_SIGNING_IDENTITY" ]; then
            ./tools/build-macos-pkg.sh \
              --binary "$RUNNER_TEMP/pb-darwin-arm64" \
              --output dist/pb-darwin-arm64.pkg \
              --version "$RELEASE_VERSION" \
              --signing-identity "$APPLE_INSTALLER_SIGNING_IDENTITY"
          else
            ./tools/build-macos-pkg.sh \
              --binary "$RUNNER_TEMP/pb-darwin-arm64" \
              --output dist/pb-darwin-arm64.pkg \
              --version "$RELEASE_VERSION"
          fi
      - name: Notarize and staple macOS PKG
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_INSTALLER_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/pb-darwin-arm64.pkg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/pb-darwin-arm64.pkg
          xcrun stapler validate dist/pb-darwin-arm64.pkg
          pkgutil --check-signature dist/pb-darwin-arm64.pkg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-darwin-arm64
          path: dist/pb-darwin-arm64.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-publication:
    name: Publish five assets and TUF metadata
    needs: [release-authority, release-contract, release-linux, release-windows, release-macos]
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
      needs.release-authority.result == 'success' &&
      needs.release-contract.result == 'success' &&
      needs.release-linux.result == 'success' &&
      needs.release-windows.result == 'success' &&
      needs.release-macos.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 35
    environment: paperboat-tuf-published
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download the five build handoffs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Download native Windows qualification handoffs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualification-windows-*
          path: qualification
          merge-multiple: true
      - name: Require exactly five release files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              'pb-windows-amd64.exe',
              'pb-windows-arm64.exe',
              'pb-linux-amd64',
              'pb-linux-arm64',
              'pb-darwin-arm64.pkg',
          }
          root = Path('dist')
          actual = {path.name for path in root.iterdir() if path.is_file() and not path.is_symlink()}
          if actual != expected:
              raise SystemExit(f'release file set is {sorted(actual)}, expected {sorted(expected)}')
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.is_symlink() or path.stat().st_size == 0:
                  raise SystemExit(f'invalid release file: {path}')
              print(f'{path.name}: {path.stat().st_size} bytes sha256={hashlib.sha256(path.read_bytes()).hexdigest()}')
          PY
      - name: Create an immutable draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Paperboat $RELEASE_VERSION" --notes "Paperboat $RELEASE_VERSION" --draft --latest=false
          fi
      - name: Upload only the five binaries/packages through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh release view "$RELEASE_VERSION" --json assets --jq '.assets[].name')
          while IFS= read -r file; do
            name=$(basename "$file")
            if ! printf '%s\n' "$existing" | grep -Fxq "$name"; then
              gh release upload "$RELEASE_VERSION" "$file"
            fi
          done < <(find dist -maxdepth 1 -type f -print | sort)
      - name: Verify GitHub asset bytes and exact asset set without re-downloading
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" dist <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          root = pathlib.Path(sys.argv[2])
          expected = {path.name: path for path in root.iterdir() if path.is_file()}
          assets = {asset['name']: asset for asset in release.get('assets', [])}
          if set(assets) != set(expected):
              raise SystemExit(f'GitHub asset set is {sorted(assets)}, expected {sorted(expected)}')
          for name, path in expected.items():
              asset = assets[name]
              digest = asset.get('digest')
              if asset.get('size') != path.stat().st_size:
                  raise SystemExit(f'GitHub asset size mismatch: {name}')
              if not digest:
                  raise SystemExit(f'GitHub API did not return a digest for {name}')
              expected_digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(f'GitHub asset digest mismatch: {name}')
          PY
      - name: Publish release assets without changing Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # TUF/current.json must never point at a draft-only asset. Make the
          # verified assets public first, while leaving the Latest selector
          # unchanged until the origin exchange succeeds below.
          # `gh release edit` leaves the Latest selector untouched when the
          # --latest flag is omitted. Explicitly passing make_latest=false
          # would unset an already-latest release during a retry.
          gh release edit "$RELEASE_VERSION" --draft=false --target "$GITHUB_SHA"
      - name: Configure protected release origin identity
        env:
          PAPERBOAT_RELEASE_SSH_KEY: ${{ secrets.PAPERBOAT_RELEASE_SSH_KEY }}
          PAPERBOAT_RELEASE_KNOWN_HOSTS: ${{ secrets.PAPERBOAT_RELEASE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAPERBOAT_RELEASE_SSH_KEY" || { echo 'PAPERBOAT_RELEASE_SSH_KEY is required' >&2; exit 1; }
          test -n "$PAPERBOAT_RELEASE_KNOWN_HOSTS" || { echo 'PAPERBOAT_RELEASE_KNOWN_HOSTS is required' >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PAPERBOAT_RELEASE_SSH_KEY" > "$HOME/.ssh/paperboat-release"
          printf '%s\n' "$PAPERBOAT_RELEASE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/paperboat-release" "$HOME/.ssh/known_hosts"
      - name: Fetch and validate production TUF signing state
        env:
          RELEASE_HOST: ${{ needs.release-authority.outputs.release_host }}
          PAPERBOAT_TUF_KEY_TARGETS_1: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_1 }}
          PAPERBOAT_TUF_KEY_TARGETS_2: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_2 }}
          PAPERBOAT_TUF_KEY_SNAPSHOT_1: ${{ secrets.PAPERBOAT_TUF_KEY_SNAPSHOT_1 }}
          PAPERBOAT_TUF_KEY_TIMESTAMP_2: ${{ secrets.PAPERBOAT_TUF_KEY_TIMESTAMP_2 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PAPERBOAT_TUF_KEY_TARGETS_1 PAPERBOAT_TUF_KEY_TARGETS_2 PAPERBOAT_TUF_KEY_SNAPSHOT_1 PAPERBOAT_TUF_KEY_TIMESTAMP_2; do
            test -n "${!name}" || { echo "$name is required" >&2; exit 1; }
          done
          repository="$RUNNER_TEMP/tuf-production"
          mkdir -p "$repository"
          ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST" \
            'tar -C /opt/paperboat/releases/current/tuf -cf - metadata' | tar -C "$repository" -xf -
          mkdir -p "$repository/targets"
          install -m 0600 tools/tuf-repository/active-signing-state.json "$repository/.signing-state.json"
          go run ./tools/tuf-repository validate-signers \
            -repository "$repository" \
            -trusted-root "$GITHUB_WORKSPACE/internal/hostruntime/bootstrap/trusted-root.json"
          printf 'PAPERBOAT_TUF_REPOSITORY=%s\n' "$repository" >> "$GITHUB_ENV"
      - name: Sign TUF metadata for the five GitHub assets
        env:
          PAPERBOAT_TUF_CI: '1'
          PAPERBOAT_GITHUB_REPOSITORY: ${{ github.repository }}
          PAPERBOAT_TUF_KEY_TARGETS_1: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_1 }}
          PAPERBOAT_TUF_KEY_TARGETS_2: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_2 }}
          PAPERBOAT_TUF_KEY_SNAPSHOT_1: ${{ secrets.PAPERBOAT_TUF_KEY_SNAPSHOT_1 }}
          PAPERBOAT_TUF_KEY_TIMESTAMP_2: ${{ secrets.PAPERBOAT_TUF_KEY_TIMESTAMP_2 }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/tuf-repository publish \
            -repository "$PAPERBOAT_TUF_REPOSITORY" \
            -version "$RELEASE_VERSION" \
            -artifacts "$GITHUB_WORKSPACE/dist" \
            -windows-amd64-native-evidence "$GITHUB_WORKSPACE/qualification/windows-amd64-native-qualification.json" \
            -windows-arm64-native-evidence "$GITHUB_WORKSPACE/qualification/windows-arm64-native-qualification.json" \
            -rollout-revision "$GITHUB_RUN_ID" \
            -percentage 100 \
            -severity routine
          go run ./tools/tuf-repository verify-published -repository "$PAPERBOAT_TUF_REPOSITORY"
      - name: Stage the atomic server publication
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/paperboat-release"
          mkdir -p "$staged/tuf"
          cp -R "$PAPERBOAT_TUF_REPOSITORY/metadata" "$PAPERBOAT_TUF_REPOSITORY/targets" "$staged/tuf/"
          install -m 0755 tools/install.sh "$staged/install"
          install -m 0644 tools/install.ps1 "$staged/windows"
          python3 - "$staged/current.json" "$RELEASE_VERSION" "$GITHUB_REPOSITORY" dist <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          output, version, repository, dist = map(pathlib.Path, sys.argv[1:])
          version = str(version)
          repository = str(repository)
          if not re.fullmatch(r'20[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.(0|[1-9][0-9]*)', version):
              raise SystemExit('release version is invalid')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('GitHub repository is invalid')
          expected = {
              'pb-darwin-arm64.pkg': ('darwin', 'arm64', 'pkg'),
              'pb-linux-amd64': ('linux', 'amd64', 'elf'),
              'pb-linux-arm64': ('linux', 'arm64', 'elf'),
              'pb-windows-amd64.exe': ('windows', 'amd64', 'pe'),
              'pb-windows-arm64.exe': ('windows', 'arm64', 'pe'),
          }
          assets = {}
          for name, (platform, architecture, format_) in expected.items():
              path = dist / name
              if not path.is_file() or path.is_symlink() or path.stat().st_size < 1:
                  raise SystemExit(f'release asset is invalid: {name}')
              assets[name] = {
                  'platform': platform,
                  'architecture': architecture,
                  'format': format_,
                  'url': f'https://github.com/{repository}/releases/download/{version}/{name}',
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'length': path.stat().st_size,
              }
          current = {'schema': 'paperboat.release-current/v1', 'version': version, 'repository': repository, 'assets': assets}
          output.write_text(json.dumps(current, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          bundle="$RUNNER_TEMP/paperboat-release-$RELEASE_VERSION.tgz"
          tar -C "$staged" -czf "$bundle" current.json install windows tuf
          digest=$(sha256sum "$bundle" | awk '{print $1}')
          printf 'PAPERBOAT_RELEASE_BUNDLE=%s\n' "$bundle" >> "$GITHUB_ENV"
          printf 'PAPERBOAT_RELEASE_BUNDLE_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
      - name: Atomically activate current.json and TUF on the server
        env:
          RELEASE_HOST: ${{ needs.release-authority.outputs.release_host }}
        shell: bash
        run: |
          set -euo pipefail
          remote_bundle="/opt/paperboat/releases/staging/paperboat-release-$RELEASE_VERSION-$GITHUB_SHA.tgz"
          remote_script="/opt/paperboat/releases/staging/publish-tuf-origin-$GITHUB_RUN_ID.sh"
          scp -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "$PAPERBOAT_RELEASE_BUNDLE" "root@$RELEASE_HOST:$remote_bundle"
          scp -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes tools/publish-tuf-origin.sh "root@$RELEASE_HOST:$remote_script"
          ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST" \
            "chmod 0700 '$remote_script' && '$remote_script' '$remote_bundle' /opt/paperboat/releases '$RELEASE_VERSION' '$PAPERBOAT_RELEASE_BUNDLE_SHA256'"
      - name: Mark the verified GitHub release latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "$RELEASE_VERSION" --draft=false --latest --target "$GITHUB_SHA"
