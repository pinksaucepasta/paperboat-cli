name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable candidate version (YYYY.MM.DD.N)
        required: true
        type: string

concurrency:
  group: release-candidate-${{ github.repository }}-${{ github.sha }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read
  id-token: write
  attestations: write

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  qualified-commit:
    name: Verify exact commit qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Require successful CI and platform contracts for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'Fast repository quality contract'
            'Linux race detector'
            'Vulnerability and license checks'
            'Native linux amd64 contract'
            'Native linux arm64 contract'
            'Native macos arm64 contract'
            'Native windows amd64 contract'
            'Native windows arm64 contract'
            'Windows arm64 beta independent cross-build'
          )
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          for name in "${required[@]}"; do
            conclusion="$(jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at) | last | .conclusion // "missing"' <<<"$checks")"
            if [[ "$conclusion" != success ]]; then
              echo "Required check is not successful for ${GITHUB_SHA}: ${name} (${conclusion})" >&2
              exit 1
            fi
          done

  release-unix:
    name: Build Unix release assets
    needs: qualified-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Candidate builds reuse the module/build cache; qualification still
          # consumes the exact uploaded artifacts rather than rebuilding them.
          cache: true
      - name: Validate release version
        run: ./tools/release-version.sh validate "${RELEASE_VERSION}"
      - name: Build Unix archives only
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          DEFAULT_SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
          DEFAULT_RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEFAULT_SERVER_URL}" || { echo "PAPERBOAT_DEFAULT_SERVER_URL repository variable is required" >&2; exit 1; }
          test -n "${DEFAULT_RELEASE_URL}" || { echo "PAPERBOAT_DEFAULT_RELEASE_URL repository variable is required" >&2; exit 1; }
          case "${DEFAULT_SERVER_URL}" in https://*) ;; *) echo "PAPERBOAT_DEFAULT_SERVER_URL must use https" >&2; exit 1 ;; esac
          mkdir -p dist stage
          for target in darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=${VERSION} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=${DEFAULT_SERVER_URL} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=${DEFAULT_RELEASE_URL}" \
              -o "stage/pb${suffix}" ./cmd/pb
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=${VERSION} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=${DEFAULT_SERVER_URL} -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=${DEFAULT_RELEASE_URL}" \
              -o "stage/pb-launcher${suffix}" ./cmd/pb-launcher
            cp "stage/pb${suffix}" "dist/pb_${VERSION}_${os}_${arch}"
            cp "stage/pb${suffix}" "dist/pb-${os}-${arch}"
            cp "stage/pb${suffix}" "dist/cli-${os}-${arch}"
            cp "stage/pb${suffix}" "dist/runtime-${os}-${arch}"
            cp "stage/pb${suffix}" "dist/hostd-${os}-${arch}"
            cp "stage/pb${suffix}" "dist/updater-${os}-${arch}"
            cp "stage/pb-launcher${suffix}" "dist/launcher-${os}-${arch}"
            tar -C stage -czf "dist/paperboat_${VERSION}_${os}_${arch}.tar.gz" pb pb-launcher
            rm "stage/pb${suffix}" "stage/pb-launcher${suffix}"
          done
          bash tools/package-manifests.sh dist "${GITHUB_REPOSITORY}" "${VERSION}"
          cp tools/install.sh dist/install.sh
      - name: Upload Unix release handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unix
          path: dist
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Windows ${{ matrix.architecture }} (${{ matrix.channel }}) package
    needs: qualified-commit
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            channel: stable
            runner: windows-2025
          - architecture: arm64
            channel: beta
            runner: windows-2025
    env:
      PAPERBOAT_ARCH: ${{ matrix.architecture }}
      PAPERBOAT_CHANNEL: ${{ matrix.channel }}
      PAPERBOAT_DEFAULT_SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
      PAPERBOAT_DEFAULT_RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned WiX toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~\.nuget\packages
            ~\.dotnet\tools
            ~\.store
          key: wix-5.0.2-${{ runner.os }}-${{ runner.arch }}
      - name: Add native Windows tool paths
        shell: powershell
        run: |
          'C:\Program Files\PowerShell\7' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\Python313' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate Windows release pipeline contract
        shell: cmd
        run: '"C:\\Program Files\\Git\\bin\\bash.exe" --noprofile --norc -e -o pipefail -c "./packaging/windows/scripts/validate-release-pipeline.sh"'
      - name: Validate first-party Windows packaging contract
        shell: powershell
        run: |
          & go run ./packaging/windows/cmd/validate --root packaging/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging contract validation failed.' }
          & go test -count=1 ./packaging/windows/cmd/... ./packaging/windows/manifest/...
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging tests failed.' }
      - name: Install pinned WiX Toolset
        shell: powershell
        run: |
          $toolDirectory = Join-Path $env:USERPROFILE '.dotnet\tools'
          $cachedWix = Join-Path $toolDirectory 'wix.exe'
          if (-not (Test-Path -LiteralPath $cachedWix -PathType Leaf)) {
            dotnet tool install --global wix --version 5.0.2
            if ($LASTEXITCODE -ne 0) { throw 'Pinned WiX 5.0.2 installation failed.' }
          }
          $env:PATH = "$toolDirectory;$env:PATH"
          $wix = (Get-Command wix.exe -ErrorAction Stop).Path
          $wixVersion = (& $wix --version | Out-String).Trim()
          if ($wixVersion -notmatch '(^|[^0-9])5\.0\.2([^0-9]|$)') {
            throw "Expected WiX 5.0.2, got $wixVersion."
          }
          "PAPERBOAT_WIX_PATH=$wix" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
          "PAPERBOAT_WIX_VERSION=5.0.2" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Build native Windows PE inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage\windows-$env:PAPERBOAT_ARCH"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $stage, $dist | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:PAPERBOAT_DEFAULT_SERVER_URL) -or [string]::IsNullOrWhiteSpace($env:PAPERBOAT_DEFAULT_RELEASE_URL)) {
            throw 'PAPERBOAT_DEFAULT_SERVER_URL and PAPERBOAT_DEFAULT_RELEASE_URL repository variables are required.'
          }
          if ($env:PAPERBOAT_DEFAULT_SERVER_URL -notmatch '^https://') {
            throw 'PAPERBOAT_DEFAULT_SERVER_URL must use https.'
          }
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = $env:PAPERBOAT_ARCH
          $ldflags = "-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$version -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=$env:PAPERBOAT_DEFAULT_SERVER_URL -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=$env:PAPERBOAT_DEFAULT_RELEASE_URL"
          & go build -buildvcs=false -trimpath -ldflags $ldflags -o (Join-Path $stage 'pb.exe') ./cmd/pb
          if ($LASTEXITCODE -ne 0) { throw 'Windows amd64/arm64 CLI build failed.' }
          & go build -buildvcs=false -trimpath -ldflags $ldflags -o (Join-Path $stage 'pb-launcher.exe') ./cmd/pb-launcher
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher build failed.' }
          foreach ($role in @('paperboat-runtime.exe', 'paperboat-hostd.exe', 'paperboat-updater.exe')) {
            Copy-Item -LiteralPath (Join-Path $stage 'pb.exe') -Destination (Join-Path $stage $role)
          }
          "PAPERBOAT_WINDOWS_STAGE=$stage" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
          "PAPERBOAT_WINDOWS_DIST=$dist" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Apply optional Authenticode and verify every Windows PE
        shell: powershell
        env:
          PAPERBOAT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_B64 }}
          PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pePaths = @(
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'pb.exe'),
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'pb-launcher.exe'),
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'paperboat-runtime.exe'),
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'paperboat-hostd.exe'),
            (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'paperboat-updater.exe')
          )
          & ./packaging/windows/scripts/sign-and-verify.ps1 `
            -Path $pePaths `
            -Architecture $env:PAPERBOAT_ARCH
          if (-not $?) { throw 'Windows PE signing or verification failed.' }
      - name: Build MSI with WiX 5.0.2
        shell: powershell
        run: |
          & ./packaging/windows/scripts/build-msi.ps1 `
            -Version $env:RELEASE_VERSION `
            -Architecture $env:PAPERBOAT_ARCH `
            -Channel $env:PAPERBOAT_CHANNEL `
            -StagingDirectory $env:PAPERBOAT_WINDOWS_STAGE `
            -OutputDirectory $env:PAPERBOAT_WINDOWS_DIST `
            -WixCommand $env:PAPERBOAT_WIX_PATH `
            -ExpectedWixVersion $env:PAPERBOAT_WIX_VERSION
          if (-not $?) { throw 'Windows MSI build failed.' }
      - name: Apply optional Authenticode and verify the MSI
        shell: powershell
        env:
          PAPERBOAT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_B64 }}
          PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $msi = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("paperboat_{0}_windows_{1}.msi" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH)
          & ./packaging/windows/scripts/sign-and-verify.ps1 `
            -Path @($msi) `
            -Architecture $env:PAPERBOAT_ARCH
          if (-not $?) { throw 'Windows MSI signing or verification failed.' }
      - name: Package verified Windows ZIP
        shell: powershell
        run: |
          $env:SOURCE_DATE_EPOCH = '0'
          $zip = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("paperboat_{0}_windows_{1}.zip" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH)
          & ./packaging/windows/scripts/package-zip.ps1 `
            --version $env:RELEASE_VERSION `
            --architecture $env:PAPERBOAT_ARCH `
            --channel $env:PAPERBOAT_CHANNEL `
            --staging $env:PAPERBOAT_WINDOWS_STAGE `
            --output $zip
          if (-not $?) { throw 'Windows ZIP packaging failed.' }
      - name: Verify Windows cross-architecture artifacts
        shell: powershell
        run: |
          $msi = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("paperboat_{0}_windows_{1}.msi" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH)
          $zip = Join-Path $env:PAPERBOAT_WINDOWS_DIST ("paperboat_{0}_windows_{1}.zip" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH)
          & ./packaging/windows/scripts/verify-cross-artifacts.ps1 `
            -Architecture $env:PAPERBOAT_ARCH `
            -StagingDirectory $env:PAPERBOAT_WINDOWS_STAGE `
            -MsiPath $msi `
            -ZipPath $zip
          if (-not $?) { throw 'Windows cross-architecture artifact verification failed.' }
      - name: Copy verified PE release assets
        shell: powershell
        run: |
          $files = @{
            'pb.exe' = "paperboat_{0}_windows_{1}_pb.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
            'pb-launcher.exe' = "paperboat_{0}_windows_{1}_pb-launcher.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
            'paperboat-runtime.exe' = "paperboat_{0}_windows_{1}_paperboat-runtime.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
            'paperboat-hostd.exe' = "paperboat_{0}_windows_{1}_paperboat-hostd.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
            'paperboat-updater.exe' = "paperboat_{0}_windows_{1}_paperboat-updater.exe" -f $env:RELEASE_VERSION, $env:PAPERBOAT_ARCH
          }
          foreach ($sourceName in $files.Keys) {
            Copy-Item -LiteralPath (Join-Path $env:PAPERBOAT_WINDOWS_STAGE $sourceName) -Destination (Join-Path $env:PAPERBOAT_WINDOWS_DIST $files[$sourceName])
          }
          # The one-shot https://get.pprbt.dev/install bootstrap downloads a
          # stable, architecture-specific name. Keep this as a byte-for-byte
          # copy of the already verified CLI so its TUF digest is authoritative.
          Copy-Item -LiteralPath (Join-Path $env:PAPERBOAT_WINDOWS_STAGE 'pb.exe') -Destination (Join-Path $env:PAPERBOAT_WINDOWS_DIST ("pb-windows-{0}.exe" -f $env:PAPERBOAT_ARCH))
          $tufFiles = @{
            'pb.exe' = "cli-windows-$env:PAPERBOAT_ARCH"
            'pb-launcher.exe' = "launcher-windows-$env:PAPERBOAT_ARCH"
            'paperboat-runtime.exe' = "runtime-windows-$env:PAPERBOAT_ARCH"
            'paperboat-hostd.exe' = "hostd-windows-$env:PAPERBOAT_ARCH"
            'paperboat-updater.exe' = "updater-windows-$env:PAPERBOAT_ARCH"
          }
          foreach ($sourceName in $tufFiles.Keys) {
            Copy-Item -LiteralPath (Join-Path $env:PAPERBOAT_WINDOWS_STAGE $sourceName) -Destination (Join-Path $env:PAPERBOAT_WINDOWS_DIST $tufFiles[$sourceName])
          }
      - name: Generate signing manifest, checksums, SBOM, and provenance handoff
        shell: powershell
        run: |
          & ./packaging/windows/scripts/generate-signing-handoff.ps1 `
            -Version $env:RELEASE_VERSION `
            -Architecture $env:PAPERBOAT_ARCH `
            -Channel $env:PAPERBOAT_CHANNEL `
            -OutputDirectory $env:PAPERBOAT_WINDOWS_DIST `
            -WixVersion $env:PAPERBOAT_WIX_VERSION
          if (-not $?) { throw 'Windows integrity handoff generation failed.' }
      - name: Scan signed artifacts with Microsoft Defender when available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
          } catch {
            Write-Warning "Microsoft Defender is unavailable on this GitHub-hosted Windows runner; continuing with signed-artifact integrity and provenance checks. Error: $($_.Exception.Message)"
            exit 0
          }
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            Write-Warning 'Microsoft Defender antivirus or real-time protection is unavailable on this GitHub-hosted Windows runner; continuing with signed-artifact integrity and provenance checks.'
            exit 0
          }
          Update-MpSignature -ErrorAction Stop
          $before = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | ForEach-Object ThreatID)
          Start-MpScan -ScanType CustomScan -ScanPath $env:PAPERBOAT_WINDOWS_DIST -ErrorAction Stop
          $after = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.Resources -match [regex]::Escape($env:PAPERBOAT_WINDOWS_DIST) })
          if ($after.Count -ne 0) {
            $after | Format-List | Out-String | Write-Error
            throw 'Microsoft Defender detected a threat in signed Windows release artifacts.'
          }
      - name: Upload signed Windows handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.architecture }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  windows-winget:
    name: Render final-hash WinGet manifests
    needs: windows-package
    if: needs.windows-package.result == 'success'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Download final signed MSI handoffs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-amd64
          path: input/amd64
      - name: Download final signed ARM64 MSI handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-arm64
          path: input/arm64
      - name: Render and validate WinGet manifests from final MSI bytes
        shell: powershell
        run: |
          $amd64Msi = Join-Path $env:GITHUB_WORKSPACE ("input\amd64\paperboat_{0}_windows_amd64.msi" -f $env:RELEASE_VERSION)
          $arm64Msi = Join-Path $env:GITHUB_WORKSPACE ("input\arm64\paperboat_{0}_windows_arm64.msi" -f $env:RELEASE_VERSION)
          & ./packaging/windows/scripts/render-winget.ps1 `
            -Version $env:RELEASE_VERSION `
            -Repository $env:GITHUB_REPOSITORY `
            -Amd64Msi $amd64Msi `
            -Arm64Msi $arm64Msi `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist')
          if (-not $?) { throw 'Final-hash WinGet manifest rendering failed.' }
      - name: Upload final WinGet manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-winget
          path: dist
          if-no-files-found: error
          retention-days: 14

  windows-native-qualification:
    name: Qualify final Windows ${{ matrix.architecture }} ${{ matrix.stability }} assets
    needs: windows-package
    if: needs.windows-package.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            stability: stable
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned WiX toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~\.nuget\packages
            ~\.dotnet\tools
            ~\.store
          key: wix-5.0.2-${{ runner.os }}-${{ runner.arch }}
      - name: Add native Windows tool paths
        shell: powershell
        run: |
          'C:\Program Files\PowerShell\7' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\Python313' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Resolve PowerShell 7 for native qualification
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files\PowerShell\7\pwsh.exe',
            'C:\Program Files\PowerShell\7-preview\pwsh.exe'
          )
          $candidates += @(Get-ChildItem -Path 'C:\Users' -Filter pwsh.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $pwsh = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($pwsh)) { throw 'PowerShell 7 (pwsh.exe) is required for native Windows qualification.' }
          "PAPERBOAT_PWSH_PATH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download final Windows assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-${{ matrix.architecture }}
          path: input
      - name: Verify native runner and release MSI architecture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedOSArchitecture = if ('${{ matrix.architecture }}' -eq 'amd64') { 'X64' } else { 'Arm64' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne $expectedOSArchitecture) {
            throw "Final Windows ${{ matrix.architecture }} qualification requires a native $expectedOSArchitecture runner."
          }
          $msi = Join-Path $env:GITHUB_WORKSPACE ("input\paperboat_{0}_windows_${{ matrix.architecture }}.msi" -f $env:RELEASE_VERSION)
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) { throw "Final ${{ matrix.architecture }} MSI is missing: $msi" }
          "PAPERBOAT_FINAL_WINDOWS_MSI=$msi" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Install pinned WiX for qualification upgrade fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          if (-not (Test-Path -LiteralPath $wix -PathType Leaf)) {
            dotnet tool install --global wix --version 5.0.2
            if ($LASTEXITCODE -ne 0) { throw 'Pinned WiX 5.0.2 installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $wix -PathType Leaf)) { throw "WiX was not installed at $wix." }
          $version = (& $wix --version | Out-String).Trim()
          if ($version -notmatch '(^|[^0-9])5\.0\.2([^0-9]|$)') { throw "Expected WiX 5.0.2, got $version." }
          "PAPERBOAT_WINDOWS_E2E_WIX=$wix" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Build native upgrade fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = $env:RELEASE_VERSION.Split('.')
          if ($parts.Count -ne 4) { throw "Invalid release version: $env:RELEASE_VERSION" }
          $upgradeVersion = '{0}.{1}.{2}.{3}' -f $parts[0], $parts[1], $parts[2], (([uint64]$parts[3]) + 1)
          "PAPERBOAT_NATIVE_UPGRADE_VERSION=$upgradeVersion" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
          & ./packaging/windows/scripts/Build-NativeQualificationArtifacts.ps1 `
            -Version $env:RELEASE_VERSION `
            -UpgradeVersion $upgradeVersion `
            -Architecture ${{ matrix.architecture }} `
            -WixCommand $env:PAPERBOAT_WINDOWS_E2E_WIX `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'paperboat-final-${{ matrix.architecture }}-qualification')
          if (-not $?) { throw 'Native ${{ matrix.architecture }} qualification upgrade fixture build failed.' }
      - name: Run native qualification against final MSI
        shell: powershell
        run: |
          & ./packaging/windows/scripts/Invoke-NativeWindowsQualification.ps1 `
            -MsiPath $env:PAPERBOAT_FINAL_WINDOWS_MSI `
            -UpgradeMsiPath $env:PAPERBOAT_WINDOWS_E2E_UPGRADE_MSI `
            -Version $env:RELEASE_VERSION `
            -UpgradeVersion $env:PAPERBOAT_NATIVE_UPGRADE_VERSION `
            -Architecture ${{ matrix.architecture }} `
            -ServiceFixturePath $env:PAPERBOAT_WINDOWS_E2E_SERVICE_FIXTURE `
            -OutputDirectory $env:PAPERBOAT_WINDOWS_E2E_OUTPUT
          if (-not $?) { throw 'Final Windows ${{ matrix.architecture }} qualification failed.' }
      - name: Qualify pinned WinGet OpenSSH and PaperboatSshd lifecycle
        shell: powershell
        env:
          PAPERBOAT_WINDOWS_OPENSSH_NATIVE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          # The preceding native MSI qualification intentionally verifies a
          # complete uninstall. Reinstall the same qualified MSI so the
          # PaperboatSshd lifecycle tests can launch the real installed host
          # executable rather than a missing post-uninstall path.
          $msi = $env:PAPERBOAT_FINAL_WINDOWS_MSI
          $log = Join-Path $env:RUNNER_TEMP 'paperboat-openssh-msi-reinstall.log'
          $install = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', $msi, '/qn', '/norestart', '/l*v', $log) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Paperboat MSI reinstall failed with exit code $($install.ExitCode). See $log" }
          $env:PAPERBOAT_SERVICE_EXECUTABLE = 'C:\Program Files\Paperboat\bin\pb.exe'
          if (-not (Test-Path -LiteralPath $env:PAPERBOAT_SERVICE_EXECUTABLE -PathType Leaf)) {
            throw "Installed Paperboat service executable is missing: $env:PAPERBOAT_SERVICE_EXECUTABLE"
          }
          $nativeTests = @(
            'TestNativeProvisionAndService',
            'TestNativeRepairStoppedService',
            'TestNativeUninstallOwnership',
            'TestNativeFirewallProfiles',
            'TestNativeSCMCrashRecovery'
          )
          # The installed host runtime continuously reconciles authorized_keys.
          # Suspend it while the uninstall-ownership test proves that OpenSSH
          # state is absent, then restore normal host operation unconditionally.
          Stop-Service -Name PaperboatHostd -Force -ErrorAction Stop
          try {
            foreach ($testName in $nativeTests) {
              go test -count=1 -v -run ("^$testName`$") ./internal/windowsopenssh
              if ($LASTEXITCODE -ne 0) { throw "Final Windows OpenSSH qualification failed: $testName" }
            }
          } finally {
            Start-Service -Name PaperboatHostd -ErrorAction Continue
          }
      - name: Convert native report into final-artifact TUF evidence
        if: matrix.architecture == 'amd64'
        shell: powershell
        run: |
          $report = Join-Path $env:PAPERBOAT_WINDOWS_E2E_OUTPUT 'native-windows-qualification.json'
          $evidence = Join-Path $env:PAPERBOAT_WINDOWS_E2E_OUTPUT 'windows-amd64-native-qualification.json'
          & python ./packaging/windows/scripts/convert-native-qualification-evidence.py `
            --report $report `
            --artifacts-dir (Join-Path $env:GITHUB_WORKSPACE 'input') `
            --version $env:RELEASE_VERSION `
            --output $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Final Windows amd64 TUF evidence conversion failed.' }
      - name: Upload final Windows amd64 native qualification evidence
        if: matrix.architecture == 'amd64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-amd64-native-release-qualification
          path: |
            ${{ runner.temp }}/paperboat-final-amd64-qualification/native-windows-qualification.json
            ${{ runner.temp }}/paperboat-final-amd64-qualification/windows-amd64-native-qualification.json
          if-no-files-found: error
          retention-days: 14

  windows-arm64-beta-evidence:
    name: Record Windows arm64 beta cross-build evidence
    needs: windows-package
    if: needs.windows-package.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-arm64
          path: input
      - name: Verify ARM64 PE artifacts and record beta status
        shell: bash
        run: |
          set -euo pipefail
          python3 - input <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = list(root.glob('*.exe'))
          if not files:
              raise SystemExit('Windows arm64 release artifacts are missing')
          for path in files:
              data = path.read_bytes()
              if len(data) < 0x40 or data[:2] != b'MZ':
                  raise SystemExit(f'{path}: invalid PE')
              off = int.from_bytes(data[0x3c:0x40], 'little')
              if data[off:off+4] != b'PE\0\0' or int.from_bytes(data[off+4:off+6], 'little') != 0xaa64:
                  raise SystemExit(f'{path}: not ARM64')
          PY
          python3 packaging/windows/scripts/write-arm64-native-evidence.py \
            --output windows-arm64-native-qualification.json \
            --status blocked_no_hardware \
            --reason native_windows_arm64_e2e_blocked_no_hardware \
            --workflow "$GITHUB_WORKFLOW" --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-arm64-native-release-qualification
          path: windows-arm64-native-qualification.json
          if-no-files-found: error
          retention-days: 14

  candidate-assembly:
    name: Assemble immutable qualified candidate
    if: always()
    needs: [release-unix, windows-package, windows-winget, windows-native-qualification, windows-arm64-beta-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Block candidate assembly unless all verified handoffs succeeded
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.release-unix.result }}" != "success" || "${{ needs.windows-package.result }}" != "success" || "${{ needs.windows-winget.result }}" != "success" || "${{ needs.windows-native-qualification.result }}" != "success" || "${{ needs.windows-arm64-beta-evidence.result }}" != "success" ]]; then
            echo 'Candidate assembly is blocked because a required build, packaging, WinGet, or native Windows amd64 qualification handoff did not succeed.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Download Unix release handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unix
          path: dist
      - name: Download Windows amd64 handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-amd64
          path: dist
      - name: Download Windows arm64 handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-arm64
          path: dist
      - name: Download rendered WinGet manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-winget
          path: dist/winget
      - name: Download final Windows amd64 native qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-amd64-native-release-qualification
          path: native-qualification
      - name: Download Windows arm64 native beta qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-arm64-native-release-qualification
          path: native-qualification-arm64
      - name: Verify and merge Windows release handoffs
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/windows/scripts/merge-signing-manifests.py \
            --dist dist \
            --release "${RELEASE_VERSION}"
      - name: Verify native Windows amd64 evidence against final signed assets
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/windows/scripts/convert-native-qualification-evidence.py \
            --report native-qualification/native-windows-qualification.json \
            --artifacts-dir dist \
            --version "${RELEASE_VERSION}" \
            --verify-evidence native-qualification/windows-amd64-native-qualification.json
          cp native-qualification/windows-amd64-native-qualification.json dist/
          cp native-qualification-arm64/windows-arm64-native-qualification.json dist/
      - name: Add certified OpenSSH compatibility metadata to release
        shell: bash
        run: |
          set -euo pipefail
          cp internal/windowsopenssh/compatibility.json dist/windows-openssh-compatibility.json
      - name: Verify WinGet manifests still match downloaded MSI bytes
        shell: bash
        run: |
          set -euo pipefail
          cp dist/winget/stable/*.yaml dist/
          cp dist/winget/beta/*.yaml dist/
          python3 packaging/windows/scripts/verify-winget-manifests.py --dist dist --release "${RELEASE_VERSION}"
          rm -rf dist/winget
      - name: Generate final release checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done) > dist/SHA256SUMS
      - name: Generate final SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/paperboat.spdx.json
      - name: Refresh checksums after SBOM generation
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done) > dist/SHA256SUMS
      - name: Attest final release assets and preserve provenance handoff
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.exe
            dist/*.sha256
            dist/pb-*
            dist/pb_*
            dist/cli-*
            dist/runtime-*
            dist/hostd-*
            dist/updater-*
            dist/launcher-*
            dist/install.sh
            dist/SHA256SUMS
            dist/*.spdx.json
            dist/windows-signing-manifest*.json
            dist/windows-provenance-*.json
            dist/windows-amd64-native-qualification.json
            dist/windows-arm64-native-qualification.json
            dist/Pinksaucepasta.Paperboat*.yaml
            dist/windows-openssh-compatibility.json
      - name: Write immutable candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('dist')
          artifacts = []
          for path in sorted(p for p in root.iterdir() if p.is_file()):
              artifacts.append({
                  'name': path.name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'size': path.stat().st_size,
              })
          manifest = {
              'schema': 'paperboat.release-candidate/v1',
              'version': os.environ['RELEASE_VERSION'],
              'commit': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'artifacts': artifacts,
          }
          (root / 'release-candidate.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload immutable qualified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ env.RELEASE_VERSION }}
          path: dist
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
