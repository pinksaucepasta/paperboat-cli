name: Release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release version
        run: ./tools/release-version.sh validate "${GITHUB_REF_NAME}"
      - name: Test
        run: make check
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
          DEFAULT_SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
        run: |
          set -euo pipefail
          test -n "${DEFAULT_SERVER_URL}" || { echo "PAPERBOAT_DEFAULT_SERVER_URL repository variable is required" >&2; exit 1; }
          case "${DEFAULT_SERVER_URL}" in https://*) ;; *) echo "PAPERBOAT_DEFAULT_SERVER_URL must use https" >&2; exit 1 ;; esac
          mkdir -p dist stage
          version="${VERSION}"
          commit="${GITHUB_SHA}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$version -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$commit -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=${DEFAULT_SERVER_URL}" \
              -o "stage/pb" ./cmd/pb
            cp "stage/pb" "dist/pb_${VERSION}_${os}_${arch}"
            cp "stage/pb" "dist/pb-${os}-${arch}"
            tar -C stage -czf "dist/paperboat_${VERSION}_${os}_${arch}.tar.gz" pb
            rm "stage/pb"
          done
          bash tools/package-manifests.sh dist "${GITHUB_REPOSITORY}" "$VERSION"
          cp tools/install.sh dist/install.sh
          (cd dist && sha256sum paperboat_* > SHA256SUMS)
          (cd dist && sha256sum pb-* pb_* >> SHA256SUMS)
          (cd dist && sha256sum install.sh >> SHA256SUMS)
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/paperboat.spdx.json
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/pb-*
            dist/pb_*
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish hosted image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/hosted/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PAPERBOAT_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/pinksaucepasta/paperboat-hosted:${{ github.ref_name }}
            ghcr.io/pinksaucepasta/paperboat-hosted:latest
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
