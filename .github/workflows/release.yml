name: Release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Validate release version
        run: ./tools/release-version.sh validate "${GITHUB_REF_NAME}"
      - name: Test
        run: make check
      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006" >/dev/null
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          version="${VERSION}"
          commit="${GITHUB_SHA}"
          for target in android/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            [ "$os" = windows ] && suffix=".exe"
            build_mode=()
            [ "$os" = android ] && build_mode=(-buildmode=pie)
            cgo_enabled=0
            cc=cc
            if [ "$os" = android ]; then
              cgo_enabled=1
              cc="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
              test -x "$cc"
            fi
            CGO_ENABLED="$cgo_enabled" GOOS="$os" GOARCH="$arch" CC="$cc" go build -trimpath "${build_mode[@]}" \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$version -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$commit -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1" \
              -o "stage/pb$suffix" ./cmd/pb
            if [ "$os" = darwin ] || [ "$os" = linux ]; then
              cp "stage/pb" "dist/pb_${VERSION}_${os}_${arch}"
            fi
            if [ "$os" = windows ]; then
              (cd stage && zip -q "../dist/paperboat_${VERSION}_${os}_${arch}.zip" "pb$suffix")
            else
              tar -C stage -czf "dist/paperboat_${VERSION}_${os}_${arch}.tar.gz" pb
            fi
            rm "stage/pb$suffix"
          done
          bash tools/package-manifests.sh dist "${GITHUB_REPOSITORY}" "$VERSION"
          (cd dist && sha256sum paperboat_* > SHA256SUMS)
      - name: Sign machine artifacts
        env:
          VERSION: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.MACHINE_ARTIFACT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "MACHINE_ARTIFACT_SIGNING_KEY is required" >&2; exit 1; }
          key_file="${RUNNER_TEMP}/machine-signing-key"
          printf '%s' "$SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="pb_${VERSION}_${os}_${arch}"
            go run ./tools/machine-artifact \
              -artifact "${GITHUB_WORKSPACE}/dist/$name" -private-key "$key_file" -version "$VERSION" \
              -platform "$os" -architecture "$arch" \
              -url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/$name" \
              -manifest-output "${GITHUB_WORKSPACE}/dist/manifest-${os}-${arch}.json" \
              -public-key-output "${GITHUB_WORKSPACE}/dist/paperboat-machine-artifact-public-key"
          done
          jq -s 'add' dist/manifest-*.json > dist/paperboat-machine-artifacts.json
          rm dist/manifest-*.json
          (cd dist && sha256sum pb_* >> SHA256SUMS)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/paperboat.spdx.json
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/pb_*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
