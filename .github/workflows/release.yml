name: Release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release version
        run: ./tools/release-version.sh validate "${GITHUB_REF_NAME}"
      - name: Test
        run: make check
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          version="${VERSION}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            [ "$os" = windows ] && suffix=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/pinksaucepasta/paperboat-cli/internal/buildinfo.Version=$version -X github.com/pinksaucepasta/paperboat-cli/internal/buildinfo.ProtocolVersion=1" \
              -o "stage/pb$suffix" ./cmd/pb
            if [ "$os" = windows ]; then
              (cd stage && zip -q "../dist/paperboat-cli_${VERSION}_${os}_${arch}.zip" "pb$suffix")
            else
              tar -C stage -czf "dist/paperboat-cli_${VERSION}_${os}_${arch}.tar.gz" pb
            fi
            rm "stage/pb$suffix"
          done
          tools/package-manifests.sh dist "${GITHUB_REPOSITORY}" "$VERSION"
          (cd dist && sha256sum paperboat-cli_* > SHA256SUMS)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/paperboat-cli.spdx.json
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
