name: Windows maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Maintenance operation'
        required: true
        type: choice
        options:
          - restore-victus-qualification-state
          - inspect-victus-health
          - prepare-victus-clean-qualification
          - clean-victus-qualification-residue

permissions:
  contents: read

jobs:
  clean-victus:
    if: inputs.action == 'clean-victus-qualification-residue'
    runs-on: [self-hosted, Windows, X64, paperboat-windows-11-iot-ltsc]
    timeout-minutes: 5
    steps:
      - name: Remove only failed qualification residue
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Service 'PaperboatPreview-*' -ErrorAction SilentlyContinue | ForEach-Object {
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue
            sc.exe delete $_.Name | Out-Host
          }
          foreach ($service in @('PaperboatHostd','PaperboatUpdated','PaperboatSshd')) {
            if (Get-Service $service -ErrorAction SilentlyContinue) {
              Stop-Service $service -Force -ErrorAction SilentlyContinue
              sc.exe delete $service | Out-Host
            }
          }
          Remove-Item 'HKLM:\Software\Paperboat' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'C:\Program Files\Paperboat' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'C:\ProgramData\Paperboat' -Recurse -Force -ErrorAction SilentlyContinue
          $bin = 'C:\Program Files\Paperboat\bin'
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $cleanPath = (($machinePath -split ';' | Where-Object { $_.Trim().TrimEnd('\') -ine $bin }) -join ';').Trim(';')
          [Environment]::SetEnvironmentVariable('Path', $cleanPath, 'Machine')
          Write-Output 'Failed qualification residue removed; preserved Backup3 snapshots were not modified.'

  prepare-victus:
    if: inputs.action == 'prepare-victus-clean-qualification'
    runs-on: [self-hosted, Windows, X64, paperboat-windows-11-iot-ltsc]
    timeout-minutes: 10
    steps:
      - name: Snapshot live state and prepare clean qualification host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $programBackup = 'C:\PaperboatQualificationProgramBackup3'
          $stateBackup = 'C:\PaperboatQualificationStateBackup3'
          $registryBackup = 'C:\PaperboatQualificationRegistryBackup3.reg'
          foreach ($path in @($programBackup, $stateBackup, $registryBackup)) {
            if (Test-Path -LiteralPath $path) { throw "Refusing to overwrite existing qualification snapshot: $path" }
          }
          Stop-Service PaperboatHostd,PaperboatUpdated,PaperboatSshd -Force -ErrorAction SilentlyContinue
          Get-Service 'PaperboatPreview-*' -ErrorAction SilentlyContinue | ForEach-Object {
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue
            sc.exe delete $_.Name | Out-Host
          }
          Get-Process paperboat*,sshd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          reg.exe export 'HKLM\Software\Paperboat' $registryBackup /y | Out-Host
          if (Test-Path -LiteralPath 'C:\Program Files\Paperboat') { Move-Item 'C:\Program Files\Paperboat' $programBackup }
          if (Test-Path -LiteralPath 'C:\ProgramData\Paperboat') { Move-Item 'C:\ProgramData\Paperboat' $stateBackup }
          foreach ($service in @('PaperboatHostd','PaperboatUpdated','PaperboatSshd')) {
            sc.exe delete $service | Out-Host
          }
          Remove-Item 'HKLM:\Software\Paperboat' -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output 'Victus is prepared for clean MSI qualification; snapshots are preserved at the explicit qualification backup paths.'

  inspect-victus:
    if: inputs.action == 'inspect-victus-health'
    runs-on: [self-hosted, Windows, X64, paperboat-windows-11-iot-ltsc]
    timeout-minutes: 5
    steps:
      - name: Inspect live Paperboat services and logs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Service PaperboatHostd,PaperboatUpdated,PaperboatSshd | Format-Table Name,Status,StartType
          Get-CimInstance Win32_Service -Filter "Name='PaperboatHostd' OR Name='PaperboatUpdated' OR Name='PaperboatSshd'" | Format-List Name,State,StartName,PathName
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          Write-Output "MACHINE_PATH_HAS_PAPERBOAT=$($machinePath -split ';' -contains 'C:\Program Files\Paperboat\bin')"
          Get-Command pwsh.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          Get-ChildItem -Path 'C:\Program Files\PowerShell','C:\Users' -Filter pwsh.exe -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 20 FullName,Length,LastWriteTime
          Get-ChildItem -LiteralPath 'C:\ProgramData\Paperboat' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'log|error|startup|observation|health' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 30 FullName,Length,LastWriteTime
          Get-Content -LiteralPath 'C:\ProgramData\Paperboat\PaperboatHostd-worker-startup-error.log' -Tail 80 -ErrorAction SilentlyContinue
          Get-Content -LiteralPath 'C:\ProgramData\Paperboat\ssh\logs\service.log' -Tail 120 -ErrorAction SilentlyContinue
          Get-Content -LiteralPath 'C:\ProgramData\Paperboat\manual-out.log' -Tail 80 -ErrorAction SilentlyContinue
          Get-WinEvent -LogName Application -MaxEvents 100 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Paperboat' } |
            Select-Object -First 20 TimeCreated,ProviderName,LevelDisplayName,Message | Format-List

  restore-victus:
    if: inputs.action == 'restore-victus-qualification-state'
    runs-on: [self-hosted, Windows, X64, paperboat-windows-11-iot-ltsc]
    timeout-minutes: 10
    steps:
      - name: Restore live Paperboat state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Stop-Service PaperboatHostd,PaperboatUpdated,PaperboatSshd -Force -ErrorAction SilentlyContinue
          Get-Service 'PaperboatPreview-*' -ErrorAction SilentlyContinue | ForEach-Object {
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue
            sc.exe delete $_.Name | Out-Host
          }
          Get-Process paperboat*,sshd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $programBackup = 'C:\PaperboatQualificationProgramBackup3'
          $stateBackup = 'C:\PaperboatQualificationStateBackup3'
          if (-not (Test-Path $programBackup)) { $programBackup = 'C:\PaperboatQualificationProgramBackup2' }
          if (-not (Test-Path $stateBackup)) { $stateBackup = 'C:\PaperboatQualificationStateBackup2' }
          foreach ($nested in @('C:\Program Files\Paperboat\PaperboatQualificationProgramBackup3', 'C:\Program Files\Paperboat\PaperboatQualificationProgramBackup2')) {
            if (Test-Path -LiteralPath $nested) {
              $restoredProgram = 'C:\PaperboatQualificationProgramRestored'
              if (Test-Path -LiteralPath $restoredProgram) { throw "Refusing to overwrite existing program staging path: $restoredProgram" }
              Move-Item -LiteralPath $nested -Destination $restoredProgram
              Remove-Item -LiteralPath 'C:\Program Files\Paperboat' -Recurse -Force
              Move-Item -LiteralPath $restoredProgram -Destination 'C:\Program Files\Paperboat'
              break
            }
          }
          foreach ($nested in @('C:\ProgramData\Paperboat\PaperboatQualificationStateBackup3', 'C:\ProgramData\Paperboat\PaperboatQualificationStateBackup2')) {
            if (Test-Path -LiteralPath $nested) {
              $restoredState = 'C:\PaperboatQualificationStateRestored'
              if (Test-Path -LiteralPath $restoredState) { throw "Refusing to overwrite existing state staging path: $restoredState" }
              Move-Item -LiteralPath $nested -Destination $restoredState
              Remove-Item -LiteralPath 'C:\ProgramData\Paperboat' -Recurse -Force
              Move-Item -LiteralPath $restoredState -Destination 'C:\ProgramData\Paperboat'
              break
            }
          }
          $programBackupLeaf = Split-Path -Leaf $programBackup
          $stateBackupLeaf = Split-Path -Leaf $stateBackup
          if (Test-Path -LiteralPath $programBackup) {
            Move-Item -LiteralPath $programBackup -Destination 'C:\Program Files\Paperboat'
          }
          if (Test-Path -LiteralPath $stateBackup) {
            Move-Item -LiteralPath $stateBackup -Destination 'C:\ProgramData\Paperboat'
          }
          # Move-Item nests a source directory when its destination already
          # exists. Recover that exact interrupted shape for either snapshot
          # generation, replacing only the known Paperboat destinations.
          $nestedProgramBackup = Join-Path 'C:\Program Files\Paperboat' $programBackupLeaf
          if (Test-Path -LiteralPath $nestedProgramBackup) {
            $restoredProgram = 'C:\PaperboatQualificationProgramRestored'
            if (Test-Path -LiteralPath $restoredProgram) { throw "Refusing to overwrite existing program staging path: $restoredProgram" }
            Move-Item -LiteralPath $nestedProgramBackup -Destination $restoredProgram
            Remove-Item -LiteralPath 'C:\Program Files\Paperboat' -Recurse -Force
            Move-Item -LiteralPath $restoredProgram -Destination 'C:\Program Files\Paperboat'
          }
          $nestedStateBackup = Join-Path 'C:\ProgramData\Paperboat' $stateBackupLeaf
          if (Test-Path -LiteralPath $nestedStateBackup) {
            $restoredState = 'C:\PaperboatQualificationStateRestored'
            if (Test-Path -LiteralPath $restoredState) { throw "Refusing to overwrite existing state staging path: $restoredState" }
            Move-Item -LiteralPath $nestedStateBackup -Destination $restoredState
            Remove-Item -LiteralPath 'C:\ProgramData\Paperboat' -Recurse -Force
            Move-Item -LiteralPath $restoredState -Destination 'C:\ProgramData\Paperboat'
          }
          $registryBackup = 'C:\PaperboatQualificationRegistryBackup3.reg'
          if (-not (Test-Path $registryBackup)) { $registryBackup = 'C:\PaperboatQualificationRegistryBackup.reg' }
          if (Test-Path -LiteralPath $registryBackup) {
            reg.exe import $registryBackup | Out-Host
          }

          # Qualification temporarily tightened these files for a test
          # identity. Restore the production service ACL before LocalSystem
          # Hostd starts. Limit this repair to Paperboat-owned SSH state.
          $sshState = 'C:\ProgramData\Paperboat\ssh'
          if (Test-Path -LiteralPath $sshState) {
            icacls.exe $sshState /reset /T /C | Out-Host
            icacls.exe $sshState /grant:r 'SYSTEM:(OI)(CI)F' 'Administrators:(OI)(CI)F' /T /C | Out-Host
            $hostKeys = Join-Path $sshState 'hostkeys'
            if (Test-Path -LiteralPath $hostKeys) {
              # OpenSSH rejects private keys if any broad/localized Users ACE
              # survives an icacls name/SID rewrite. Build the DACL by SID so
              # this remains correct on non-English Windows images too.
              $systemSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-18')
              $adminsSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')
              Get-ChildItem -LiteralPath $hostKeys -File -Recurse | ForEach-Object {
                $acl = New-Object System.Security.AccessControl.FileSecurity
                $acl.SetAccessRuleProtection($true, $false)
                $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($systemSid, 'FullControl', 'Allow')))
                $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($adminsSid, 'FullControl', 'Allow')))
                Set-Acl -LiteralPath $_.FullName -AclObject $acl
              }
            }
          }

          $runtime = 'C:\Program Files\Paperboat\releases\runtime-current\paperboat-runtime.exe'
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) { throw "Restored runtime is missing: $runtime" }
          if (-not (Get-Service PaperboatHostd -ErrorAction SilentlyContinue)) {
            New-Service -Name PaperboatHostd -BinaryPathName ('"' + $runtime + '" __runtime-hostd') -DisplayName 'PaperboatHostd' -Description 'Paperboat stable host supervisor' -StartupType Automatic | Out-Null
          }
          if (-not (Get-Service PaperboatUpdated -ErrorAction SilentlyContinue)) {
            New-Service -Name PaperboatUpdated -BinaryPathName ('"' + $runtime + '" __runtime-updated') -DisplayName 'PaperboatUpdated' -Description 'Paperboat signed update service' -StartupType Manual | Out-Null
          }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $bin = 'C:\Program Files\Paperboat\bin'
          if (($machinePath -split ';') -notcontains $bin) {
            [Environment]::SetEnvironmentVariable('Path', ($machinePath.TrimEnd(';') + ';' + $bin), 'Machine')
          }
          Start-Service PaperboatSshd -ErrorAction SilentlyContinue
          try { Start-Service PaperboatHostd -ErrorAction Stop } catch {
            Write-Output 'HOSTD_START_FAILED'
            Get-CimInstance Win32_Service -Filter "Name='PaperboatHostd'" | Format-List Name,State,StartName,PathName
            Get-ChildItem -LiteralPath 'C:\ProgramData\Paperboat' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -Last 20 FullName
            Get-WinEvent -LogName System -MaxEvents 80 -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -eq 'Service Control Manager' -and $_.Message -match 'Paperboat' } | Select-Object -First 12 TimeCreated,Message | Format-List
            throw
          }
          Start-Service PaperboatUpdated
          $deadline = (Get-Date).AddSeconds(90)
          do {
            $paperboatSshd = Get-Service PaperboatSshd -ErrorAction SilentlyContinue
            if ($null -ne $paperboatSshd) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ($null -eq $paperboatSshd) {
            Get-Content -LiteralPath 'C:\ProgramData\Paperboat\ssh\logs\service.log' -Tail 120 -ErrorAction SilentlyContinue
            throw 'PaperboatSshd was not recreated by Hostd within 90 seconds.'
          }
          if ($paperboatSshd.Status -ne 'Running') { Start-Service PaperboatSshd -ErrorAction Stop }
          Get-Service PaperboatHostd,PaperboatUpdated,PaperboatSshd | Format-Table Name,Status,StartType
